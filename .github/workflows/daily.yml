name: CPVN daily EOD refresh

# DỰ PHÒNG TỰ ĐỘNG cho server chính (103.165.144.161, Scheduled Task 15:15 T2–T6):
# 16:05 giờ VN (09:05 UTC) Actions kiểm tra — hôm nay server ĐÃ push "EOD <ngày>" thì thôi,
# CHƯA có (server hỏng/tắt) thì Actions tự cào và push thay. Hai máy không bao giờ đụng nhau.
# Bấm "Run workflow" ở tab Actions để chạy tay bất cứ lúc nào (chạy tay bỏ qua kiểm tra).
on:
  schedule:
    - cron: "5 9 * * 1-5"   # 16:05 giờ VN, Thứ 2–6 — sau giờ server chính 50 phút
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20

      - name: Kiểm tra server chính đã cập nhật chưa
        id: guard
        run: |
          TODAY=$(TZ=Asia/Ho_Chi_Minh date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && git log -10 --format=%s | grep -q "EOD $TODAY"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Server đã push EOD $TODAY — Actions không cần chạy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      # Thứ 2 chạy --full (làm mới cả SLCP/ngành/logo/PE/PB + vá NN); các ngày khác chỉ mốc giá + EOD
      - name: Cập nhật EOD
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python refresh_daily.py --full
          else
            python refresh_daily.py
          fi

      - name: Commit dữ liệu mới
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "cpvn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add universe.json data/
          git commit -m "EOD $(TZ=Asia/Ho_Chi_Minh date +%F)" || echo "không có thay đổi"
          git pull --rebase origin main || true
          git push
