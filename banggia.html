<style>
  :root{
    --bg:#0a0a0c; --panel:#15151a; --panel2:#1e1e26; --line:#2a2a33;
    --txt:#e9e9ef; --muted:#8a8a99; --accent:#e11d48;
    --green:#16c784; --red:#ea3943; --yellow:#eab308; --purple:#c026d3; --cyan:#38bdf8;
    --hdr1:#111114; --hdr2:#0d0d10; --thead:#0e0e12; --sticky:#0b0b0e;
    --rowline:rgba(255,255,255,.05); --rowhover:rgba(255,255,255,.035);
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceef2; --line:#dde1e8;
    --txt:#16181d; --muted:#66707f;
    --green:#0b9b61; --red:#dc3644; --yellow:#a16207; --purple:#9333ea; --cyan:#0369a1;
    --hdr1:#ffffff; --hdr2:#f0f2f5; --thead:#f0f2f5; --sticky:#fafbfc;
    --rowline:rgba(0,0,0,.06); --rowhover:rgba(0,0,0,.045);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}

  header{display:flex;align-items:center;gap:6px;padding:9px 13px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(var(--hdr1),var(--hdr2));
    position:sticky;top:0;z-index:20}
  .thmbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:15px;cursor:pointer}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px;font-size:24px;white-space:nowrap;flex:0 0 160px;overflow:hidden}
  .brand .mark{width:30px;height:30px;flex-shrink:0;
    border-radius:50%;filter:drop-shadow(0 0 7px rgba(45,212,191,.45))}
  /* chữ CPVN.IO: TRẮNG toàn bộ (giao diện sáng dùng màu chữ nền sáng để còn đọc được) */
  .brand{color:#fff}
  html[data-theme="light"] .brand{color:var(--txt)}
  .brand b{color:inherit}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:12px}
  .tabs a{padding:8px 13px;font-size:14px;font-weight:700;color:var(--muted)}
  .tabs a.on{color:#fff;background:var(--accent)}
  .tabs a:not(.on):hover{color:var(--txt);background:var(--panel2)}
  .spacer{flex:1}
  input.search{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;font-size:14px;outline:none;width:185px;flex-shrink:1;min-width:120px}

  /* hàng thống kê tổng quan */
  #stats{display:flex;gap:16px;align-items:center;padding:7px 16px;font-size:13px;
    border-bottom:1px solid var(--line);background:var(--hdr2);overflow-x:auto;white-space:nowrap}
  .st{display:flex;gap:6px;align-items:baseline;flex-shrink:0}
  .st .nm{color:var(--muted);font-weight:700}
  .st .val{font-weight:800}
  .stsep{width:1px;height:15px;background:var(--line);flex-shrink:0;align-self:center}
  /* độ rộng thị trường: chip 3 màu — nét riêng CPVN */
  .breadth{display:flex;gap:5px;align-items:center;flex-shrink:0}
  .breadth b{padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .breadth b.bchip{cursor:pointer;border:1px solid transparent;transition:transform .08s}
  .breadth b.bchip:hover{transform:translateY(-1px);filter:brightness(1.25)}
  .breadth b.bchip.on{border-color:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.08) inset}
  .breadth b.bclear{cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .breadth b.bclear:hover{color:var(--txt)}

  /* bộ lọc nằm cùng hàng header với ô tìm kiếm */
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
  .seg button.on{color:#fff;background:var(--accent)}
  header select{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:8px 9px;font-size:13.5px;outline:none;max-width:165px}
  #cnt{color:var(--muted);font-size:12px;white-space:nowrap}

  /* bảng xếp hạng */
  #wrap{overflow-x:auto;padding:0 8px 10px}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
  thead th{position:sticky;top:0;background:var(--thead);color:var(--muted);font-size:12px;
    font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;white-space:nowrap;z-index:5}
  thead th:hover{color:var(--txt)}
  thead th.sorted{color:#ffd60a}
  tbody td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--rowline);white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--rowhover)}
  th.l,td.l{text-align:left}
  td.rank{color:var(--muted);font-size:12px;width:38px}
  td.star{width:30px;font-size:15px;color:#3f3f4a;cursor:pointer;text-align:center}
  td.star.on{color:#ffd60a}
  .co{display:flex;align-items:center;gap:10px}
  .co img{width:29px;height:29px;border-radius:7px;background:#fff;object-fit:contain;flex-shrink:0}
  .co .noimg{width:29px;height:29px;border-radius:7px;background:var(--panel2);display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}
  .co .sym{font-weight:800;font-size:16px}
  .co .nm{color:var(--muted);font-size:13px;max-width:132px;overflow:hidden;text-overflow:ellipsis}
  .co .ex{font-size:10.5px;font-weight:800;color:var(--muted);border:1px solid var(--line);
    border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
  td.price{font-weight:800;font-size:13.5px}
  td.price.up{animation:flashG .9s} td.price.down{animation:flashR .9s}
  @keyframes flashG{0%{background:rgba(22,199,132,.28)}100%{background:transparent}}
  @keyframes flashR{0%{background:rgba(234,57,67,.28)}100%{background:transparent}}
  .pc{font-weight:700}
  .badge{display:inline-block;min-width:64px;text-align:center;padding:2.5px 7px;border-radius:7px;font-weight:700;font-size:12.5px}
  canvas.spark{width:118px;height:34px;display:block;margin-left:auto}
  td.nn.pos{color:var(--green);font-weight:700} td.nn.neg{color:var(--red);font-weight:700}

  /* phân trang */
  #pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
  #pager button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  #pager button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #pager button:disabled{opacity:.35;cursor:default}

  footer{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 14px 22px;
    color:var(--muted);font-size:11.5px;flex-wrap:wrap;text-align:center}
  #kho.ok{color:var(--green)} #kho.bad{color:var(--yellow)}

  @media(max-width:760px){
    .brand{font-size:19px} .brand .mark{width:24px;height:24px}
    /* tabs = HÀNG RIÊNG cuộn ngang, không đè lên bộ lọc sàn/ngành */
    .tabs{order:2;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .tabs::-webkit-scrollbar{display:none}
    .tabs a{padding:7px 12px;font-size:13px;white-space:nowrap}
    .brand{order:1} .spacer{display:none} #thm{order:1;margin-left:auto}
    /* hàng 3: bộ lọc — thấy ĐỦ Tất cả/Theo dõi + sàn + ngành */
    .seg{order:3;flex:0 0 auto}
    header select{order:3;max-width:none;flex:1;min-width:96px}
    #cnt{display:none}
    input.search{order:4;flex:1;width:auto;min-width:0}
    /* ép cột Cổ phiếu chỉ ~1/3 màn hình: khoá cứng bề rộng, phần dư dồn về cột số */
    table{min-width:640px}
    td.rank{width:24px;padding:8px 4px;font-size:10.5px}
    th:nth-child(1){padding:9px 4px}
    th:nth-child(3),td:nth-child(3){width:120px;min-width:120px;max-width:120px;left:32px}
    th:nth-child(1),td:nth-child(1){left:0}
    .co{gap:6px}
    .co img,.co .noimg{width:26px;height:26px}
    .co .sym{font-size:14.5px}
    .co .ex{font-size:8.5px;padding:0 3px;margin-left:4px}
    table{min-width:940px;font-size:12.5px}
    /* ghim cột hạng + mã khi cuộn ngang (kiểu bảng coin mobile) */
    th:nth-child(1),td:nth-child(1){position:sticky;left:0;background:var(--sticky);z-index:6}
    th:nth-child(3),td:nth-child(3){position:sticky;left:38px;background:var(--sticky);z-index:6}
    td:nth-child(2),th:nth-child(2){display:none}   /* ẩn cột sao cho gọn */
    .co .nm{display:none}
    td{padding:8px 7px}
  }
</style>

<script>
'use strict';
const $=id=>document.getElementById(id);
const ST={ scope:'all', floor:'all', sector:'all', q:'', sort:'mcap', dir:-1, page:1, PER:100, rows:[], bd:null };
// bd = lọc theo độ rộng thị trường: 'up'|'flat'|'down'|'ceil'|'floor' (bấm chip màu ở hàng thống kê)

/* giá trị sort/hiển thị cho từng mã */
function val(c,k){
  switch(k){
    case 'sym':   return c.sym;
    case 'price': return c.price||0;
    case 'chg1d': return c.chg1d==null?-1e9:c.chg1d;
    case 'w': case 'm': case 'y': return c.pct&&c.pct[k]!=null?c.pct[k]:-1e9;
    case 'mcap':  return c.mcapLive||c.mcap||0;
    case 'gtgd':  return c.gtgd||0;
    case 'nn':    return (c.fbuy||0)-(c.fsell||0);
    case 'pe':    return c.pe==null?1e9:+c.pe;
    default:      return 0;
  }
}
function filterRows(){
  let list=[...CP.coins.values()];
  if(ST.scope==='watch'){ const w=CP.watch.get(); list=list.filter(c=>w.has(c.sym)); }
  if(ST.floor==='VN30') list=list.filter(c=>CP.vn30.has(c.sym));
  else if(ST.floor==='HNX30') list=list.filter(c=>CP.hnx30.has(c.sym));
  else if(ST.floor!=='all') list=list.filter(c=>c.ex===ST.floor);
  if(ST.sector!=='all') list=list.filter(c=>c.sector===ST.sector);
  if(ST.q){ const q=ST.q.toUpperCase();
    list=list.filter(c=>c.sym.includes(q)||c.name.toUpperCase().includes(q)); }
  if(ST.bd){                                  // lọc theo chip màu độ rộng
    list=list.filter(c=>{
      if(!c.traded) return false;
      const isCe=c.ceil>0&&c.price>=c.ceil, isFl=c.flr>0&&c.price<=c.flr;
      switch(ST.bd){
        case 'ceil':  return isCe;
        case 'floor': return isFl;
        case 'up':    return c.chg1d>0.01;
        case 'down':  return c.chg1d<-0.01;
        default:      return !(c.chg1d>0.01)&&!(c.chg1d<-0.01);
      }
    });
  }
  const dir=ST.dir, k=ST.sort==='rank'?'mcap':ST.sort;
  list.sort((a,b)=>{ const va=val(a,k), vb=val(b,k);
    return (typeof va==='string') ? dir*va.localeCompare(vb) : dir*(va-vb); });
  ST.rows=list;
}
function badge(v,extra){
  if(v==null||v===-1e9) return '<span class="badge" style="color:var(--muted)">—</span>';
  let bg,cl;
  if(extra==='ceil'){ bg='rgba(192,38,211,.16)'; cl='var(--purple)'; }
  else if(extra==='floor'){ bg='rgba(56,189,248,.16)'; cl='var(--cyan)'; }
  else if(Math.abs(v)<0.005){ bg='rgba(234,179,8,.14)'; cl='var(--yellow)'; }
  else if(v>0){ bg='rgba(22,199,132,.13)'; cl='var(--green)'; }
  else { bg='rgba(234,57,67,.13)'; cl='var(--red)'; }
  return `<span class="badge" style="background:${bg};color:${cl}">${CP.pcTxt(v)}</span>`;
}
function render(){
  filterRows();
  if(ST.bd) ST.rows=ST.rows.slice(0,100);     // lọc theo màu: 100 mã lớn nhất là đủ xem
  const total=ST.rows.length, pages=Math.max(1,Math.ceil(total/ST.PER));
  if(ST.page>pages) ST.page=pages;
  const start=(ST.page-1)*ST.PER, slice=ST.rows.slice(start,start+ST.PER);
  const W=CP.watch.get();
  const BDN={up:'đang tăng',flat:'đứng giá',down:'đang giảm',ceil:'giá trần',floor:'giá sàn'};
  $('cnt').textContent=ST.bd?`${total} mã ${BDN[ST.bd]}`:`${total.toLocaleString('en-US')} mã`;
  $('tb').innerHTML=slice.map((c,i)=>{
    const nn=(c.fbuy||0)-(c.fsell||0);
    const ceilHit=c.ceil>0&&c.price>0&&c.price>=c.ceil, floorHit=c.flr>0&&c.price>0&&c.price<=c.flr;
    const logo=CP.logoHTML(c.sym,c.img);
    return `<tr data-sym="${c.sym}">
      <td class="rank">${start+i+1}</td>
      <td class="star ${W.has(c.sym)?'on':''}" data-star="${c.sym}">${W.has(c.sym)?'★':'☆'}</td>
      <td class="l"><div class="co">${logo}<div><span class="sym">${c.sym}</span><span class="ex">${c.ex}</span><div class="nm">${CP.esc(c.name)}</div></div></div></td>
      <td class="price" data-price style="color:${CP.col1d(c)}">${CP.fmtD(c.price)}</td>
      <td>${CP.fmtVnd(c.mcapLive||c.mcap)}</td>
      <td>${badge(c.chg1d, ceilHit?'ceil':floorHit?'floor':null)}</td>
      <td>${CP.fmtVnd(c.gtgd)}</td>
      <td class="nn ${nn>0?'pos':nn<0?'neg':''}">${nn?((nn>0?'+':'−')+CP.fmtShares(Math.abs(nn)).replace(' cp','')):'—'}</td>
      <td>${c.pe!=null?(+c.pe).toFixed(1):'—'}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('#tb tr').forEach(tr=>tr.onclick=e=>{
    if(e.target.closest('[data-star]')) return;
    location.href='/cophieu/'+tr.dataset.sym;
  });
  document.querySelectorAll('#tb [data-star]').forEach(td=>td.onclick=()=>{
    const on=CP.watch.toggle(td.dataset.star);
    td.classList.toggle('on',on); td.textContent=on?'★':'☆';
    if(ST.scope==='watch') render();
  });
  document.querySelectorAll('thead th').forEach(th=>th.classList.toggle('sorted',th.dataset.k===ST.sort));
  renderPager(pages);
}
function renderPager(pages){
  const p=$('pager'); if(pages<=1){ p.innerHTML=''; return; }
  const btn=(n,lb,on,dis)=>`<button data-p="${n}" ${dis?'disabled':''} class="${on?'on':''}">${lb}</button>`;
  const items=[]; items.push(btn(ST.page-1,'‹',false,ST.page===1));
  const around=new Set([1,2,pages-1,pages,ST.page-1,ST.page,ST.page+1]);
  let last=0;
  for(let n=1;n<=pages;n++){ if(!around.has(n)) continue;
    if(last&&n-last>1) items.push('<span style="color:var(--muted)">…</span>');
    items.push(btn(n,n,n===ST.page,false)); last=n; }
  items.push(btn(ST.page+1,'›',false,ST.page===pages));
  p.innerHTML=items.join('');
  p.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{
    ST.page=+b.dataset.p; render(); window.scrollTo({top:0,behavior:'smooth'}); });
}

/* hàng thống kê tổng quan + trạng thái kho */
function renderStats(){
  const s=CP.marketStats();
  const idx=(nm,val,chg)=>`<span class="st"><span class="nm">${nm}</span><span class="val">${val}</span>`+
    (chg!=null?`<span style="color:${CP.pcCol(chg)};font-weight:700">${CP.pcTxt(chg)}</span>`:'')+`</span>`;
  let html=(CP.indices||[]).map(d=>idx(d.name,d.value.toLocaleString('en-US',{maximumFractionDigits:2}),d.chg)).join('');
  html+='<span class="stsep"></span>';
  html+=idx('Vốn hoá TT',CP.fmtVnd(s.mcap),null);
  html+=idx('Thanh khoản',Math.round(s.gtgd/1e9).toLocaleString('en-US')+' tỷ',null);
  // chip màu: bấm để lọc bảng theo đúng nhóm màu đó (bấm lại = bỏ lọc). Trần/sàn chỉ còn MÀU, không chữ.
  const chip=(k,txt,bg,col,tip)=>`<b data-bd="${k}" title="${tip}"`+
    ` class="bchip${ST.bd===k?' on':''}" style="background:${bg};color:${col}">${txt}</b>`;
  html+=`<span class="breadth"><span class="nm" style="color:var(--muted);font-weight:700">Độ rộng</span>`+
    chip('up',`▲ ${s.up}`,'rgba(22,199,132,.15)','var(--green)','Mã tăng — bấm để lọc')+
    chip('flat',`– ${s.flat}`,'rgba(234,179,8,.13)','var(--yellow)','Mã đứng giá — bấm để lọc')+
    chip('down',`▼ ${s.down}`,'rgba(234,57,67,.15)','var(--red)','Mã giảm — bấm để lọc')+
    (s.ceil?chip('ceil',String(s.ceil),'rgba(192,38,211,.16)','var(--purple)','Mã trần — bấm để lọc'):'')+
    (s.floor?chip('floor',String(s.floor),'rgba(56,189,248,.16)','var(--cyan)','Mã sàn — bấm để lọc'):'')+
    (ST.bd?`<b class="bclear" title="Bỏ lọc">✕</b>`:'')+`</span>`;
  $('stats').innerHTML=html;
  $('stats').querySelectorAll('b[data-bd]').forEach(el=>el.onclick=()=>{
    ST.bd=ST.bd===el.dataset.bd?null:el.dataset.bd; ST.page=1; render(); renderStats();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const bc=$('stats').querySelector('.bclear');
  if(bc) bc.onclick=()=>{ ST.bd=null; ST.page=1; render(); renderStats(); };
}
function renderKho(){
  const el=$('kho'), h=CP.health;
  if(!h){ el.textContent='kho dữ liệu: phiên '+(CP.eodDate||'—'); return; }
  el.className=h.ok?'ok':'bad';
  el.textContent=`kho dữ liệu: phiên ${h.date} · ${h.ok?'đầy đủ ✓':'thiếu một phần — dùng bản gần nhất'}`;
}

/* flash giá khi poll về */
let prevPrice=new Map();
function snapPrices(){ prevPrice=new Map([...CP.coins.values()].map(c=>[c.sym,c.price])); }
function flashUpdate(){
  renderStats();
  document.querySelectorAll('#tb tr').forEach(tr=>{
    const c=CP.coins.get(tr.dataset.sym); if(!c) return;
    const cell=tr.querySelector('[data-price]'); if(!cell) return;
    const old=prevPrice.get(c.sym);
    cell.textContent=CP.fmtD(c.price); cell.style.color=CP.col1d(c);
    if(old&&c.price&&old!==c.price){
      cell.classList.remove('up','down'); void cell.offsetWidth;
      cell.classList.add(c.price>old?'up':'down');
    }
  });
  snapPrices();
}

/* điều khiển */
document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#scope button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); ST.scope=b.dataset.v; ST.page=1; render();
});
$('floor').onchange=e=>{ ST.floor=e.target.value; ST.page=1; render(); };
$('sector').onchange=e=>{ ST.sector=e.target.value; ST.page=1; render(); };
$('q').oninput=e=>{ ST.q=e.target.value.trim(); ST.page=1; render(); };
document.querySelectorAll('thead th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(ST.sort===k) ST.dir*=-1; else { ST.sort=k; ST.dir=(k==='sym')?1:-1; }
  ST.page=1; render();
});

/* giao diện sáng/tối — lưu lựa chọn, dùng chung cho các trang CPVN */
const thmBtn=$('thm');
function applyThmIcon(){ thmBtn.textContent=document.documentElement.dataset.theme==='light'?'☀️':'🌙'; }
thmBtn.onclick=()=>{
  const light=document.documentElement.dataset.theme!=='light';
  document.documentElement.dataset.theme=light?'light':'';
  localStorage.setItem('cpvn_theme',light?'light':'');
  applyThmIcon();
};
applyThmIcon();

(async function init(){
  await CP.loadBase();
  const cnt={};
  for(const c of CP.coins.values()) cnt[c.sector]=(cnt[c.sector]||0)+1;
  $('sector').innerHTML='<option value="all">Tất cả ngành</option>'+
    Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(s=>`<option>${CP.esc(s)}</option>`).join('');
  snapPrices(); render(); renderStats(); renderKho();
  CP.loadIndices().then(renderStats);
  // mỗi phút chỉ làm mới các mã của TRANG ĐANG XEM; 5 phút quét lại toàn bộ để xếp hạng đúng
  CP.startPolling(()=>{ flashUpdate(); },
    ()=>{ const st=(ST.page-1)*ST.PER; return ST.rows.slice(st,st+ST.PER).map(c=>c.sym); });
  setInterval(()=>{ CP.loadIndices().then(renderStats); },60000);
})();
</script>
