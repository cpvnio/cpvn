<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CPVN — Bảng giá cổ phiếu Việt Nam</title>
<meta name="description" content="Bảng giá & xếp hạng toàn bộ cổ phiếu Việt Nam: giá realtime, biến động 1D–1Y, vốn hoá, thanh khoản, khối ngoại, sparkline 7 ngày. Dữ liệu HOSE · HNX · UPCOM." />
<meta name="theme-color" content="#f4f5f7" />
<meta property="og:title" content="CPVN — Bảng giá cổ phiếu Việt Nam" />
<meta property="og:description" content="Xếp hạng toàn bộ cổ phiếu Việt Nam theo vốn hoá — giá, biến động, khối ngoại, sparkline." />
<link rel="icon" type="image/png" href="assets/logo-64.png?v=2" />
<script>(function(){/* MẶC ĐỊNH GIAO DIỆN SÁNG; chỉ theo lựa chọn đã lưu nếu người dùng từng đổi */
var t=localStorage.getItem('cpvn_theme');document.documentElement.dataset.theme=(t===null?'light':t);})();</script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#15151a; --panel2:#1e1e26; --line:#2a2a33;
    --txt:#e9e9ef; --muted:#8a8a99; --accent:#e11d48;
    --green:#16c784; --red:#ea3943; --yellow:#eab308; --purple:#c026d3; --cyan:#38bdf8;
    --hdr1:#111114; --hdr2:#0d0d10; --thead:#0e0e12; --sticky:#0b0b0e;
    --rowline:rgba(255,255,255,.05); --rowhover:rgba(255,255,255,.035);
  }
  html[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceef2; --line:#dde1e8;
    --txt:#16181d; --muted:#66707f;
    --green:#0b9b61; --red:#dc3644; --yellow:#a16207; --purple:#9333ea; --cyan:#0369a1;
    --hdr1:#ffffff; --hdr2:#f0f2f5; --thead:#f0f2f5; --sticky:#fafbfc;
    --rowline:rgba(0,0,0,.06); --rowhover:rgba(0,0,0,.045);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}

  header{display:flex;align-items:center;gap:6px;padding:9px 13px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:linear-gradient(var(--hdr1),var(--hdr2));
    position:sticky;top:0;z-index:20}
  .thmbtn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;font-size:15px;cursor:pointer}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.5px;font-size:24px;white-space:nowrap;flex:0 0 160px;overflow:hidden}
  .brand .mark{width:30px;height:30px;flex-shrink:0;
    border-radius:50%;filter:drop-shadow(0 0 7px rgba(45,212,191,.45))}
  /* chữ CPVN.IO: TRẮNG toàn bộ (giao diện sáng dùng màu chữ nền sáng để còn đọc được) */
  .brand{color:#fff}
  html[data-theme="light"] .brand{color:var(--txt)}
  .brand b{color:inherit}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:12px}
  .tabs a{padding:8px 13px;font-size:14px;font-weight:700;color:var(--muted)}
  .tabs a.on{color:#fff;background:var(--accent)}
  .tabs a:not(.on):hover{color:var(--txt);background:var(--panel2)}
  .spacer{flex:1}
  input.search{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:8px 12px;font-size:14px;outline:none;width:185px;flex-shrink:1;min-width:120px}

  /* hàng thống kê tổng quan */
  #stats{display:flex;gap:16px;align-items:center;padding:7px 16px;font-size:13px;
    border-bottom:1px solid var(--line);background:var(--hdr2);overflow-x:auto;white-space:nowrap}
  .st{display:flex;gap:6px;align-items:baseline;flex-shrink:0}
  .st .nm{color:var(--muted);font-weight:700}
  .st .val{font-weight:800}
  .stsep{width:1px;height:15px;background:var(--line);flex-shrink:0;align-self:center}
  /* độ rộng thị trường: chip 3 màu — nét riêng CPVN */
  .breadth{display:flex;gap:5px;align-items:center;flex-shrink:0}
  .breadth b{padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700}
  .breadth b.bchip{cursor:pointer;border:1px solid transparent;transition:transform .08s}
  .breadth b.bchip:hover{transform:translateY(-1px);filter:brightness(1.25)}
  .breadth b.bchip.on{border-color:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.08) inset}
  .breadth b.bclear{cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .breadth b.bclear:hover{color:var(--txt)}

  /* bộ lọc nằm cùng hàng header với ô tìm kiếm */
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
  .seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer}
  .seg button.on{color:#fff;background:var(--accent)}
  header select{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:8px 9px;font-size:13.5px;outline:none;max-width:165px}
  #cnt{color:var(--muted);font-size:12px;white-space:nowrap}

  /* bảng xếp hạng — FULL bề ngang màn hình; cột Cổ phiếu khoá hẹp (chỉ còn logo + mã)
     nên cột Giá nằm ngay sát mã, không còn khoảng trống dài khó dò mắt */
  #wrap{overflow-x:auto;padding:0 8px 10px}
  /* CHỮ SỐ ĐỀU BỀ RỘNG: font hệ thống mặc định dùng chữ số TỶ LỆ — số "1" hẹp hơn số
     "4" tới 2px, nên dấu phẩy và nhóm nghìn giữa các dòng không thẳng cột, nhìn cứ như
     lệch dù mép phải đã căn đúng. tabular-nums ép mọi chữ số cùng bề rộng -> thành lưới. */
  table{border-collapse:collapse;width:100%;min-width:1020px;font-size:13.5px;
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  th.l,td.l{width:150px;max-width:150px}
  thead th[data-k="price"],tbody td.price{width:92px}
  thead th{position:sticky;top:0;background:var(--thead);color:var(--muted);font-size:12px;
    font-weight:700;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;white-space:nowrap;z-index:5}
  thead th:hover{color:var(--txt)}
  thead th.sorted{color:#ffd60a}
  /* MỌI con số giá trị ĐẬM ĐỀU NHAU (trước lẫn lộn 400/600/700/800 giữa các cột nên
     nhìn cột nào cũng "nặng nhẹ" khác nhau, mất cảm giác giá trị doanh nghiệp) */
  tbody td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--rowline);
    white-space:nowrap;font-weight:700}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--rowhover)}
  th.l,td.l{text-align:left}
  td.rank{color:var(--muted);font-size:12px;width:38px;font-weight:400}
  td.star{width:30px;font-size:15px;color:#3f3f4a;cursor:pointer;text-align:center}
  td.star.on{color:#ffd60a}
  .co{display:flex;align-items:center;gap:10px}
  .co img{width:29px;height:29px;border-radius:7px;background:#fff;object-fit:contain;flex-shrink:0}
  .co .noimg{width:29px;height:29px;border-radius:7px;background:var(--panel2);display:flex;
    align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}
  .co .sym{font-weight:800;font-size:16px}
  .co .ex{font-size:10.5px;font-weight:800;color:var(--muted);border:1px solid var(--line);
    border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
  td.price{font-weight:800;font-size:13.5px}
  td.price.up{animation:flashG .9s} td.price.down{animation:flashR .9s}
  @keyframes flashG{0%{background:rgba(22,199,132,.28)}100%{background:transparent}}
  @keyframes flashR{0%{background:rgba(234,57,67,.28)}100%{background:transparent}}
  .pc{font-weight:700}
  .badge{display:inline-block;min-width:64px;text-align:center;padding:2.5px 7px;border-radius:7px;font-weight:700;font-size:12.5px}
  canvas.spark{width:118px;height:34px;display:block;margin-left:auto}
  td.nn.pos{color:var(--green)} td.nn.neg{color:var(--red)}
  td.nn .dash{color:var(--muted);font-weight:400;opacity:.5}
  td.fund.neg{color:var(--red)}
  /* KHỐI SỐ bề rộng CỐ ĐỊNH rồi CANH GIỮA ô: chữ số vẫn căn phải bên trong nên các
     dòng thẳng cột nhau, mà cả khối lại nằm giữa -> tiêu đề đứng ngay trên đầu dãy số,
     hết cảnh tiêu đề dài thò hẳn sang trái so với con số (GTGD trước lệch tới 62px). */
  thead th.m,tbody td.m{text-align:center}
  .m .n{display:inline-block;text-align:right}
  thead th.m .n{text-align:center;font-weight:700}
  /* ô ĐƠN VỊ rộng cố định, căn trái -> chữ số của cả cột dừng ở cùng một mốc */
  i.u{display:inline-block;width:24px;text-align:left;padding-left:5px;font-style:normal;
    font-weight:400;font-size:11.5px;color:var(--muted)}
  thead th i.u{font-size:12px}
  td .dash{color:var(--muted);font-weight:400;opacity:.5}

  /* ---- BỘ LỌC: van an toàn + chips + preset triết lý ---- */
  #scrBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #scrPanel{display:none;padding:10px 16px 12px;border-bottom:1px solid var(--line);background:var(--hdr2)}
  #scrPanel.on{display:block}
  .scrRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}
  .scrLb{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);
    width:92px;flex-shrink:0}
  .scrRow select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;
    padding:5px 8px;font-size:12.5px;outline:none}
  .scrRow label.ck{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--txt);
    cursor:pointer;user-select:none}
  .chipbar{display:flex;gap:5px;flex-wrap:wrap}
  .chipbar button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:14px;
    padding:4.5px 11px;font-size:12px;font-weight:700;cursor:pointer}
  .chipbar button:hover{color:var(--txt)}
  .chipbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .prewrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px;margin-top:4px}
  .pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;
    cursor:pointer;display:flex;gap:8px;align-items:center}
  .pre:hover{border-color:var(--accent)}
  .pre.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
  .pre .ic{font-size:18px;flex-shrink:0}
  .pre .nm{font-size:12.8px;font-weight:800;line-height:1.25}
  .pre .ct{margin-left:auto;flex-shrink:0;font-size:11.5px;font-weight:800;color:var(--muted);
    background:var(--panel2);border-radius:9px;padding:2px 8px}
  .pre.on .ct{background:var(--accent);color:#fff}
  #scrDesc{font-size:12px;color:var(--muted);line-height:1.55;margin-top:7px;min-height:16px}
  #scrClear{background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--muted);
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  #scrClear:hover{color:var(--txt)}
  /* cờ đỏ trong bảng */
  .redflag{display:inline-block;margin-left:5px;font-size:12px;cursor:help}
  /* toast cờ đỏ: mobile không có hover -> CHẠM ⚠ hiện chi tiết */
  #scrToast{position:fixed;left:12px;right:12px;bottom:16px;z-index:80;display:none;
    background:var(--panel);color:var(--txt);border:1.5px solid var(--red);border-radius:12px;
    padding:11px 14px;font-size:12.5px;line-height:1.6;box-shadow:0 10px 32px rgba(0,0,0,.35)}
  #scrToast b{color:var(--red)}
  #scrToast .x{float:right;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 0 4px 10px}
  @media(min-width:761px){ #scrToast{left:auto;max-width:420px} }
  @media(max-width:760px){
    #scrPanel{padding:8px 10px}
    .scrLb{width:100%;margin-bottom:-3px}
    /* MOBILE GỌN: chips 2 hàng CUỘN NGANG + preset 2 hàng CUỘN NGANG -> panel thấp,
       chọn xong là THẤY NGAY bảng kết quả thay vì phải kéo qua cả rừng nút */
    .chipbar{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;
      gap:5px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .chipbar::-webkit-scrollbar{display:none}
    .chipbar button{white-space:nowrap}
    .prewrap{display:grid;grid-template-columns:none;grid-template-rows:repeat(2,auto);
      grid-auto-flow:column;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .prewrap::-webkit-scrollbar{display:none}
    .pre{min-width:196px;padding:7px 9px}
    .pre .nm{font-size:11.8px}
  }

  /* phân trang */
  #pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
  #pager button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:7px;
    padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  #pager button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #pager button:disabled{opacity:.35;cursor:default}

  footer{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px 14px 22px;
    color:var(--muted);font-size:11.5px;flex-wrap:wrap;text-align:center}
  #kho.ok{color:var(--green)} #kho.bad{color:var(--yellow)}

  @media(max-width:760px){
    .brand{font-size:19px} .brand .mark{width:24px;height:24px}
    /* tabs = HÀNG RIÊNG cuộn ngang, không đè lên bộ lọc sàn/ngành */
    .tabs{order:2;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
    .tabs::-webkit-scrollbar{display:none}
    .tabs a{padding:7px 12px;font-size:13px;white-space:nowrap}
    .brand{order:1} .spacer{display:none} #thm{order:1;margin-left:auto}
    /* hàng 3: bộ lọc — thấy ĐỦ Tất cả/Theo dõi + sàn + ngành */
    .seg{order:3;flex:0 0 auto}
    header select{order:3;max-width:none;flex:1;min-width:96px}
    #cnt{display:none}
    input.search{order:4;flex:1;width:auto;min-width:0}
    /* ép cột Cổ phiếu chỉ ~1/3 màn hình: khoá cứng bề rộng, phần dư dồn về cột số */
    table{min-width:640px}
    td.rank{width:24px;padding:8px 4px;font-size:10.5px}
    th:nth-child(1){padding:9px 4px}
    th:nth-child(3),td:nth-child(3){width:122px;min-width:122px;max-width:122px;left:32px}
    th:nth-child(1),td:nth-child(1){left:0}
    .co{gap:6px}
    .co img,.co .noimg{width:26px;height:26px}
    .co .sym{font-size:14.5px}
    .co .ex{font-size:8.5px;padding:0 3px;margin-left:4px}
    table{min-width:1120px;font-size:12.5px}
    /* ghim cột hạng + mã khi cuộn ngang (kiểu bảng coin mobile) */
    th:nth-child(1),td:nth-child(1){position:sticky;left:0;background:var(--sticky);z-index:6}
    th:nth-child(3),td:nth-child(3){position:sticky;left:38px;background:var(--sticky);z-index:6}
    td:nth-child(2),th:nth-child(2){display:none}   /* ẩn cột sao cho gọn */
    td{padding:8px 7px}
  }
</style>
<!-- tải sẵn trang công cụ khi rảnh -> bấm tab Radar/Đường đua là mở tức thì -->

<body>
<header>
  <a class="brand" href="index.html"><img class="mark" src="assets/logo-128.png?v=2" alt="CPVN"/><span><b>CPVN</b>.IO</span></a>
  <nav class="tabs">
    <a href="index.html">Bong bóng</a>
    <a class="on" href="banggia.html">Bảng giá</a>
    <a href="congcu.html?m=radar">Radar</a>
    <a href="congcu.html?m=race">Đường đua</a>
  </nav>
  <div class="spacer"></div>
  <div class="seg" id="scope">
    <button data-v="all" class="on">Tất cả</button>
    <button data-v="watch">⭐ Theo dõi</button>
  </div>
  <select id="floor">
    <option value="all">Tất cả sàn</option>
    <option>HOSE</option><option>HNX</option><option>UPCOM</option>
    <option>VN30</option><option>HNX30</option>
  </select>
  <select id="sector"><option value="all">Tất cả ngành</option></select>
  <span id="cnt"></span>
  <input class="search" id="q" placeholder="Tìm mã / tên công ty…" />
  <button class="thmbtn" id="scrBtn" title="Bộ lọc cổ phiếu: van an toàn + lọc nhanh + 9 bộ lọc triết lý đầu tư">⚡ Lọc</button>
  <button class="thmbtn" id="thm" title="Đổi giao diện sáng/tối">🌙</button>
</header>

<div id="stats"></div>

<div id="scrPanel">
  <div class="scrRow">
    <span class="scrLb">Van an toàn</span>
    <select id="scrGtgd" title="Thanh khoản bình quân 20 phiên — lớp lọc số 1: chặn mã không giao dịch được">
      <option value="0">GTGD: tắt</option><option value="1e9">GTGD ≥ 1 tỷ/phiên</option>
      <option value="5e9" selected>GTGD ≥ 5 tỷ/phiên</option><option value="15e9">GTGD ≥ 15 tỷ/phiên</option>
    </select>
    <select id="scrMcap" title="Vốn hoá tối thiểu — 2.000/5.000 tỷ là 2 mốc trong quy tắc VN Diamond của HOSE">
      <option value="0">Vốn hoá: tắt</option><option value="5e11">Vốn hoá ≥ 500 tỷ</option>
      <option value="2e12" selected>Vốn hoá ≥ 2.000 tỷ</option><option value="5e12">Vốn hoá ≥ 5.000 tỷ</option>
    </select>
    <label class="ck" title="Loại penny dưới mệnh giá"><input type="checkbox" id="scrP10" checked/>Giá ≥ 10.000đ</label>
    <label class="ck" title="Ẩn mã đang dính cờ đỏ chất lượng lợi nhuận (dồn tích cao, CFO âm kéo dài, phải thu phình, pha loãng mạnh)"><input type="checkbox" id="scrRed"/>⚠ Ẩn mã có cờ đỏ</label>
    <button id="scrClear">✕ Xoá hết lọc</button>
  </div>
  <div class="scrRow"><span class="scrLb">Lọc nhanh</span><div class="chipbar" id="scrChips"></div></div>
  <div class="scrRow" style="align-items:flex-start"><span class="scrLb">Triết lý</span>
    <div style="flex:1;min-width:0"><div class="prewrap" id="scrPre"></div><div id="scrDesc"></div></div>
  </div>
</div>

<div id="wrap">
  <table>
    <thead>
      <tr>
        <th data-k="rank">#</th>
        <th>⭐</th>
        <th class="l" data-k="sym">Cổ phiếu</th>
        <th data-k="price">Giá (đ)</th>
        <th class="m" data-k="mcap"><span class="n">Vốn hoá</span><i class="u"></i></th>
        <th data-k="chg1d">1D %</th>
        <th class="m" data-k="gtgd" title="Giá trị giao dịch hôm nay"><span class="n">GTGD</span><i class="u"></i></th>
        <th class="m" data-k="cash" title="Tiền và tương đương tiền — kỳ báo cáo gần nhất"><span class="n">Tiền mặt</span><i class="u"></i></th>
        <th class="m" data-k="np" title="Lợi nhuận sau thuế năm đã hoàn thành gần nhất"><span class="n" id="thNp">LNST</span><i class="u"></i></th>
        <th class="m" data-k="nnb" title="Khối ngoại MUA trong ngày — tỷ đồng"><span class="n">NN mua</span><i class="u"></i></th>
        <th class="m" data-k="nns" title="Khối ngoại BÁN trong ngày — tỷ đồng"><span class="n">NN bán</span><i class="u"></i></th>
        <th data-k="pe" title="P/E tính sống theo giá hiện tại = giá / EPS">P/E</th>
        <th data-k="eps" title="EPS 4 quý gần nhất — đồng/cổ phiếu">EPS</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>
</div>
<div id="pager"></div>
<div id="scrToast"></div>

<footer>
  <span id="kho">kho dữ liệu: đang kiểm tra…</span>
  <span>·</span><span>CPVN.IO — dữ liệu HOSE · HNX · UPCOM</span>
</footer>

<script src="assets/core.js?v=20260806b"></script>
<script src="assets/screener.js?v=20260806b"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const ST={ scope:'all', floor:'all', sector:'all', q:'', sort:'mcap', dir:-1, page:1, PER:100, rows:[], bd:null };
/* trạng thái BỘ LỌC (assets/screener.js): van an toàn + chips + preset + ẩn cờ đỏ */
const SCR={ on:false, gtgd:5e9, mcap:2e12, p10:true, red:false, chips:new Set(), preset:null };
function scrVan(c){                       // van an toàn — lớp chạy TRƯỚC mọi tiêu chí
  const t=CPScreen.T[c.sym]||{};
  if(SCR.gtgd&&(t.avgval20||0)<SCR.gtgd) return false;
  if(SCR.mcap&&(c.mcapLive||c.mcap||0)<SCR.mcap) return false;
  if(SCR.p10&&(c.price||0)<10000) return false;
  return true;
}
function scrPass(c){
  if(!scrVan(c)) return false;
  for(const id of SCR.chips) if(!CPScreen.chip(id,c)) return false;
  if(SCR.preset&&!CPScreen.pass(SCR.preset,c)) return false;
  if(SCR.red&&CPScreen.flags(c).length) return false;
  return true;
}
// bd = lọc theo độ rộng thị trường: 'up'|'flat'|'down'|'ceil'|'floor' (bấm chip màu ở hàng thống kê)

/* KHỐI NGOẠI quy ra TIỀN (đồng): MUA và BÁN trong ngày tính riêng, không bù trừ. */
const nnBuy =c=>(c.fbuy ||0)*(c.price||0);
const nnSell=c=>(c.fsell||0)*(c.price||0);
/* Cột TIỀN (vốn hoá / GTGD / tiền mặt / LNST / NN mua / NN bán) — MỘT đơn vị "tỷ"
   duy nhất, viết hẳn số ra. fmtVnd giữ sẵn dấu âm (doanh nghiệp lỗ ra số âm).
   zeroDash=true -> 0 hiện gạch (khối ngoại không giao dịch); ngược lại 0 hiện "0"
   mờ để phân biệt CÓ số liệu bằng 0 với KHÔNG có số liệu. */
const DASH='<span class="dash">—</span>';
/* TÁCH SỐ RA KHỎI ĐƠN VỊ: đơn vị nằm trong ô rộng cố định căn trái, nên phần CHỮ SỐ
   của cả cột luôn kết thúc ở cùng một mốc -> đọc dọc xuống thẳng hàng tăm tắp
   (số dài ngắn khác nhau, để dính liền đơn vị thì cột chữ số sẽ so le). */
const U='<i class="u"></i>';                 // ô đơn vị rỗng: giữ chỗ cho "—", "0", tiêu đề
function money(v,zeroDash){
  const N=x=>`<span class="n">${x}</span>`;
  if(v==null) return N(DASH)+U;
  if(!v) return N(zeroDash?DASH:'<span class="dash">0</span>')+U;
  const t=CP.fmtVnd(v);
  if(t==='—') return N(DASH)+U;
  const m=/^(-?[\d.,]+)\s*(.*)$/.exec(t);
  return m?N(m[1])+`<i class="u">${m[2]}</i>`:N(t)+U;
}
/* P/E SỐNG = giá hiện tại / EPS -> nhảy theo giá suốt phiên. Thiếu EPS thì dùng P/E kho.
   P/E ÂM (đang lỗ) hoặc quá dị (>1000, EPS gần 0) là vô nghĩa -> trả null: hiện "—",
   sort luôn nằm cuối — bấm "P/E rẻ nhất" không bị mã lỗ chen lên đầu. */
const peLive=c=>{ const p=(c.eps>0&&c.price>0)?c.price/c.eps:(c.pe!=null?+c.pe:null);
  return p!=null&&p>0&&p<1000?p:null; };

/* BỀ RỘNG KHỐI SỐ TỰ CO THEO TỪNG CỘT: đo con số dài nhất đang hiển thị (và cả chữ
   tiêu đề) rồi khoá đúng bấy nhiêu. Chữ số các dòng vẫn căn phải nên thẳng cột, mà khối
   không còn thừa chỗ trống -> tiêu đề nằm sát ngay trên dãy số.
   Chạy lại sau mỗi lần dựng bảng (đổi trang / lọc / sắp xếp). */
const MCOLS=[4,6,7,8,9,10];
function fitNumCols(){
  const rows=[...document.querySelectorAll('#tb tr')];
  if(!rows.length) return;
  // đo BỀ RỘNG THẬT của chữ đã render (Range), không đoán bằng canvas: canvas không áp
  // tabular-nums và trả sai cỡ/độ đậm -> từng đo hụt cột Vốn hoá 72px thành 47px.
  const rg=document.createRange();
  const wOf=el=>{ rg.selectNodeContents(el); return rg.getBoundingClientRect().width; };
  const css=MCOLS.map(i=>{
    // CHỈ đo theo CON SỐ, KHÔNG tính chữ tiêu đề: tiêu đề dài hơn thì cứ để nó tràn
    // đều 2 bên khối (vì cả hai đều canh giữa) -> tâm tiêu đề trùng tâm dãy số.
    let w=0;
    for(const tr of rows){ const n=tr.cells[i]&&tr.cells[i].querySelector('.n');
      if(n){ const t=wOf(n); if(t>w) w=t; } }
    return `#wrap table tr>*:nth-child(${i+1}) .n{min-width:${Math.ceil(w)+2}px}`;
  }).join('');
  let st=$('numw');
  if(!st){ st=document.createElement('style'); st.id='numw'; document.head.appendChild(st); }
  if(st.textContent!==css) st.textContent=css;
}

/* giá trị sort/hiển thị cho từng mã */
function val(c,k){
  switch(k){
    case 'sym':   return c.sym;
    case 'price': return c.price||0;
    case 'chg1d': return c.chg1d==null?null:c.chg1d;
    case 'w': case 'm': case 'y': return c.pct&&c.pct[k]!=null?c.pct[k]:null;
    case 'mcap':  return c.mcapLive||c.mcap||0;
    case 'gtgd':  return c.gtgd||0;
    case 'cash':  return c.cash??null;
    case 'np':    return c.np??null;
    case 'nnb':   return nnBuy(c);
    case 'nns':   return nnSell(c);
    case 'pe':    return peLive(c);
    case 'eps':   return c.eps??null;
    default:      return 0;
  }
}
function filterRows(){
  let list=[...CP.coins.values()];
  if(ST.scope==='watch'){ const w=CP.watch.get(); list=list.filter(c=>w.has(c.sym)); }
  if(ST.floor==='VN30') list=list.filter(c=>CP.vn30.has(c.sym));
  else if(ST.floor==='HNX30') list=list.filter(c=>CP.hnx30.has(c.sym));
  else if(ST.floor!=='all') list=list.filter(c=>c.ex===ST.floor);
  if(ST.sector!=='all') list=list.filter(c=>c.sector===ST.sector);
  if(ST.q){ const q=ST.q.toUpperCase();
    list=list.filter(c=>c.sym.includes(q)||c.name.toUpperCase().includes(q)); }
  if(ST.bd){                                  // lọc theo chip màu độ rộng
    list=list.filter(c=>{
      if(!c.traded) return false;
      const isCe=c.ceil>0&&c.price>=c.ceil, isFl=c.flr>0&&c.price<=c.flr;
      switch(ST.bd){
        case 'ceil':  return isCe;
        case 'floor': return isFl;
        case 'up':    return c.chg1d>0.01;
        case 'down':  return c.chg1d<-0.01;
        default:      return !(c.chg1d>0.01)&&!(c.chg1d<-0.01);
      }
    });
  }
  if(SCR.on&&CPScreen.loaded) list=list.filter(scrPass);   // BỘ LỌC (van + chips + preset + cờ đỏ)
  const dir=ST.dir, k=ST.sort==='rank'?'mcap':ST.sort;
  /* preset Greenblatt: khi chưa đổi cột sắp xếp thì hiện ĐÚNG THỨ HẠNG của công thức */
  if(SCR.on&&SCR.preset==='mf'&&k==='mcap'&&CPScreen.mfRank){
    list.sort((a,b)=>(CPScreen.mfRank[a.sym]||99)-(CPScreen.mfRank[b.sym]||99));
    ST.rows=list; return;
  }
  /* Mã THIẾU DỮ LIỆU luôn nằm CUỐI dù sắp xếp tăng hay giảm — bấm P/E mà một loạt
     dấu "—" nhảy lên đầu bảng thì coi như cột đó vô dụng. */
  list.sort((a,b)=>{ const va=val(a,k), vb=val(b,k);
    if(typeof va==='string'||typeof vb==='string') return dir*String(va).localeCompare(String(vb));
    const na=va==null||!isFinite(va), nb=vb==null||!isFinite(vb);
    if(na||nb) return na&&nb?0:(na?1:-1);
    return dir*(va-vb); });
  ST.rows=list;
}
/* ⚠ cờ đỏ chất lượng lợi nhuận cạnh mã — chỉ hiện khi đã nạp dữ liệu bộ lọc */
function redFlag(c){
  if(!CPScreen.loaded) return '';
  const fl=CPScreen.flags(c);
  return fl.length?`<span class="redflag" title="CỜ ĐỎ chất lượng lợi nhuận:&#10;· ${fl.join('&#10;· ')}">⚠️</span>`:'';
}
function badge(v,extra){
  if(v==null||v===-1e9) return '<span class="badge" style="color:var(--muted)">—</span>';
  let bg,cl;
  if(extra==='ceil'){ bg='rgba(192,38,211,.16)'; cl='var(--purple)'; }
  else if(extra==='floor'){ bg='rgba(56,189,248,.16)'; cl='var(--cyan)'; }
  else if(Math.abs(v)<0.005){ bg='rgba(234,179,8,.14)'; cl='var(--yellow)'; }
  else if(v>0){ bg='rgba(22,199,132,.13)'; cl='var(--green)'; }
  else { bg='rgba(234,57,67,.13)'; cl='var(--red)'; }
  return `<span class="badge" style="background:${bg};color:${cl}">${CP.pcTxt(v)}</span>`;
}
function render(){
  filterRows();
  if(ST.bd) ST.rows=ST.rows.slice(0,100);     // lọc theo màu: 100 mã lớn nhất là đủ xem
  const total=ST.rows.length, pages=Math.max(1,Math.ceil(total/ST.PER));
  if(ST.page>pages) ST.page=pages;
  const start=(ST.page-1)*ST.PER, slice=ST.rows.slice(start,start+ST.PER);
  if(!slice.length){
    const msg=ST.q?`Không tìm thấy mã nào khớp “${CP.esc(ST.q)}” — thử gõ mã (VD FPT) hoặc một phần tên công ty.`
      :ST.scope==='watch'?'Chưa có mã nào trong danh sách theo dõi. Bấm dấu ☆ ở đầu mỗi dòng để lưu mã bạn quan tâm.'
      :ST.bd?'Không có mã nào thuộc nhóm này trong phiên hôm nay.'
      :SCR.on?'Không mã nào đạt bộ tiêu chí này — lọc siêu việt vốn rất khắt khe. Thử nới van an toàn, bỏ bớt chip, hoặc đổi bộ lọc.'
      :'Không có dữ liệu phù hợp bộ lọc hiện tại.';
    $('tb').innerHTML=`<tr><td colspan="13" style="text-align:center;padding:34px 16px;color:var(--muted);font-size:13.5px">${msg}</td></tr>`;
    renderPager(1); return;
  }
  const W=CP.watch.get();
  const BDN={up:'đang tăng',flat:'đứng giá',down:'đang giảm',ceil:'giá trần',floor:'giá sàn'};
  $('cnt').textContent=ST.bd?`${total} mã ${BDN[ST.bd]}`:`${total.toLocaleString('en-US')} mã`;
  $('tb').innerHTML=slice.map((c,i)=>{
    const ceilHit=c.ceil>0&&c.price>0&&c.price>=c.ceil, floorHit=c.flr>0&&c.price>0&&c.price<=c.flr;
    const logo=CP.logoHTML(c.sym,c.img);
    const pe=peLive(c);
    return `<tr data-sym="${c.sym}">
      <td class="rank">${start+i+1}</td>
      <td class="star ${W.has(c.sym)?'on':''}" data-star="${c.sym}">${W.has(c.sym)?'★':'☆'}</td>
      <td class="l" title="${CP.esc(c.name)}"><div class="co">${logo}<div><span class="sym">${c.sym}</span><span class="ex">${c.ex}</span>${redFlag(c)}</div></div></td>
      <td class="price" data-price style="color:${CP.col1d(c)}">${CP.fmtD(c.price)}</td>
      <td class="m">${money(c.mcapLive||c.mcap,true)}</td>
      <td>${badge(c.chg1d, ceilHit?'ceil':floorHit?'floor':null)}</td>
      <td class="m">${money(c.gtgd,true)}</td>
      <td class="m fund" title="${c.cashQ?'kỳ '+CP.esc(c.cashQ):''}">${money(c.cash==null?null:c.cash*1e9)}</td>
      <td class="m fund ${c.np<0?'neg':''}" title="${c.npY?'năm '+CP.esc(c.npY):''}">${money(c.np==null?null:c.np*1e9)}</td>
      <td class="m nn pos" data-nnb>${money(nnBuy(c),true)}</td>
      <td class="m nn neg" data-nns>${money(nnSell(c),true)}</td>
      <td data-pe>${pe!=null?pe.toFixed(1):'—'}</td>
      <td>${c.eps!=null?CP.fmtD(c.eps):'—'}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('#tb tr').forEach(tr=>tr.onclick=e=>{
    if(e.target.closest('[data-star]')) return;
    if(e.target.closest('.redflag')){            // chạm ⚠ (mobile không hover được title)
      e.stopPropagation();
      const c=CP.coins.get(tr.dataset.sym), fl=CPScreen.flags(c);
      const t=$('scrToast');
      t.innerHTML='<span class="x">✕</span><b>⚠ '+c.sym+' — cờ đỏ chất lượng lợi nhuận</b><br>· '+fl.join('<br>· ');
      t.style.display='block';
      t.querySelector('.x').onclick=()=>t.style.display='none';
      clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',6000);
      return;
    }
    location.href='/cophieu/'+tr.dataset.sym;
  });
  document.querySelectorAll('#tb [data-star]').forEach(td=>td.onclick=()=>{
    const on=CP.watch.toggle(td.dataset.star);
    td.classList.toggle('on',on); td.textContent=on?'★':'☆';
    if(ST.scope==='watch') render();
  });
  document.querySelectorAll('thead th').forEach(th=>th.classList.toggle('sorted',th.dataset.k===ST.sort));
  fitNumCols();
  renderPager(pages);
}
function renderPager(pages){
  const p=$('pager'); if(pages<=1){ p.innerHTML=''; return; }
  const btn=(n,lb,on,dis)=>`<button data-p="${n}" ${dis?'disabled':''} class="${on?'on':''}">${lb}</button>`;
  const items=[]; items.push(btn(ST.page-1,'‹',false,ST.page===1));
  const around=new Set([1,2,pages-1,pages,ST.page-1,ST.page,ST.page+1]);
  let last=0;
  for(let n=1;n<=pages;n++){ if(!around.has(n)) continue;
    if(last&&n-last>1) items.push('<span style="color:var(--muted)">…</span>');
    items.push(btn(n,n,n===ST.page,false)); last=n; }
  items.push(btn(ST.page+1,'›',false,ST.page===pages));
  p.innerHTML=items.join('');
  p.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>{
    ST.page=+b.dataset.p; render(); window.scrollTo({top:0,behavior:'smooth'}); });
}

/* hàng thống kê tổng quan + trạng thái kho */
function renderStats(){
  const s=CP.marketStats();
  const idx=(nm,val,chg)=>`<span class="st"><span class="nm">${nm}</span><span class="val">${val}</span>`+
    (chg!=null?`<span style="color:${CP.pcCol(chg)};font-weight:700">${CP.pcTxt(chg)}</span>`:'')+`</span>`;
  let html=(CP.indices||[]).map(d=>idx(d.name,d.value.toLocaleString('en-US',{maximumFractionDigits:2}),d.chg)).join('');
  html+='<span class="stsep"></span>';
  html+=idx('Vốn hoá TT',CP.fmtVnd(s.mcap),null);
  html+=idx('Thanh khoản',Math.round(s.gtgd/1e9).toLocaleString('en-US')+' tỷ',null);
  // chip màu: bấm để lọc bảng theo đúng nhóm màu đó (bấm lại = bỏ lọc). Trần/sàn chỉ còn MÀU, không chữ.
  const chip=(k,txt,bg,col,tip)=>`<b data-bd="${k}" title="${tip}"`+
    ` class="bchip${ST.bd===k?' on':''}" style="background:${bg};color:${col}">${txt}</b>`;
  html+=`<span class="breadth"><span class="nm" style="color:var(--muted);font-weight:700">Độ rộng</span>`+
    chip('up',`▲ ${s.up}`,'rgba(22,199,132,.15)','var(--green)','Mã tăng — bấm để lọc')+
    chip('flat',`– ${s.flat}`,'rgba(234,179,8,.13)','var(--yellow)','Mã đứng giá — bấm để lọc')+
    chip('down',`▼ ${s.down}`,'rgba(234,57,67,.15)','var(--red)','Mã giảm — bấm để lọc')+
    (s.ceil?chip('ceil',String(s.ceil),'rgba(192,38,211,.16)','var(--purple)','Mã trần — bấm để lọc'):'')+
    (s.floor?chip('floor',String(s.floor),'rgba(56,189,248,.16)','var(--cyan)','Mã sàn — bấm để lọc'):'')+
    (ST.bd?`<b class="bclear" title="Bỏ lọc">✕</b>`:'')+`</span>`;
  $('stats').innerHTML=html;
  $('stats').querySelectorAll('b[data-bd]').forEach(el=>el.onclick=()=>{
    ST.bd=ST.bd===el.dataset.bd?null:el.dataset.bd; ST.page=1; render(); renderStats();
    window.scrollTo({top:0,behavior:'smooth'});
  });
  const bc=$('stats').querySelector('.bclear');
  if(bc) bc.onclick=()=>{ ST.bd=null; ST.page=1; render(); renderStats(); };
}
function renderKho(){
  const el=$('kho'), h=CP.health;
  if(!h){ el.textContent='kho dữ liệu: phiên '+(CP.eodDate||'—'); return; }
  el.className=h.ok?'ok':'bad';
  el.textContent=`kho dữ liệu: phiên ${h.date} · ${h.ok?'đầy đủ ✓':'thiếu một phần — dùng bản gần nhất'}`;
}

/* flash giá khi poll về */
let prevPrice=new Map();
function snapPrices(){ prevPrice=new Map([...CP.coins.values()].map(c=>[c.sym,c.price])); }
function flashUpdate(){
  renderStats();
  document.querySelectorAll('#tb tr').forEach(tr=>{
    const c=CP.coins.get(tr.dataset.sym); if(!c) return;
    // khối ngoại + P/E cũng chạy theo giá trong phiên
    const b=tr.querySelector('[data-nnb]'), s=tr.querySelector('[data-nns]'), pe=tr.querySelector('[data-pe]');
    if(b) b.innerHTML=money(nnBuy(c),true);
    if(s) s.innerHTML=money(nnSell(c),true);
    if(pe){ const p=peLive(c); pe.textContent=p!=null?p.toFixed(1):'—'; }
    const cell=tr.querySelector('[data-price]'); if(!cell) return;
    const old=prevPrice.get(c.sym);
    cell.textContent=CP.fmtD(c.price); cell.style.color=CP.col1d(c);
    if(old&&c.price&&old!==c.price){
      cell.classList.remove('up','down'); void cell.offsetWidth;
      cell.classList.add(c.price>old?'up':'down');
    }
  });
  snapPrices();
}

/* điều khiển */
document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#scope button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); ST.scope=b.dataset.v; ST.page=1; render();
});
$('floor').onchange=e=>{ ST.floor=e.target.value; ST.page=1; render(); };
$('sector').onchange=e=>{ ST.sector=e.target.value; ST.page=1; render(); };
$('q').oninput=e=>{ ST.q=e.target.value.trim(); ST.page=1; render(); };
document.querySelectorAll('thead th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(ST.sort===k) ST.dir*=-1; else { ST.sort=k; ST.dir=(k==='sym')?1:-1; }
  ST.page=1; render();
});

/* ---------- PANEL BỘ LỌC ---------- */
function scrCount(fn){ let n=0; for(const c of CP.coins.values()) if(scrVan(c)&&fn(c)) n++; return n; }
function scrPaintCounts(){
  document.querySelectorAll('#scrPre .pre').forEach(el=>{
    el.querySelector('.ct').textContent=scrCount(c=>CPScreen.pass(el.dataset.id,c));
  });
}
function scrBuild(){
  $('scrChips').innerHTML=CPScreen.chips.map(x=>
    `<button data-id="${x.id}" title="${x.g}">${x.nm}</button>`).join('');
  $('scrPre').innerHTML=CPScreen.presets.map(p=>
    `<div class="pre" data-id="${p.id}"><span class="ic">${p.ic}</span><span class="nm">${p.nm}</span><span class="ct">…</span></div>`).join('');
  document.querySelectorAll('#scrChips button').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    SCR.chips.has(id)?SCR.chips.delete(id):SCR.chips.add(id);
    b.classList.toggle('on',SCR.chips.has(id));
    ST.page=1; render();
  });
  document.querySelectorAll('#scrPre .pre').forEach(el=>el.onclick=()=>{
    const id=el.dataset.id;
    SCR.preset=SCR.preset===id?null:id;
    document.querySelectorAll('#scrPre .pre').forEach(x=>x.classList.toggle('on',x.dataset.id===SCR.preset));
    const p=CPScreen.presets.find(x=>x.id===SCR.preset);
    $('scrDesc').textContent=p?p.ds:'';
    ST.page=1; render();
    // mobile: panel + rừng nút chiếm gần trọn màn hình -> chọn xong tự đưa xuống kết quả
    // (cuộn thẳng, không smooth — smooth bị nhiều môi trường nuốt mất animation)
    if(SCR.preset&&window.innerWidth<=760)
      setTimeout(()=>{ const y=$('wrap').getBoundingClientRect().top+window.scrollY-52;
        window.scrollTo(0,Math.max(0,y)); },120);
  });
  scrPaintCounts();
}
$('scrBtn').onclick=async()=>{
  const open=!$('scrPanel').classList.contains('on');
  $('scrPanel').classList.toggle('on',open);
  $('scrBtn').classList.toggle('on',open);
  if(open){
    if(!CPScreen.loaded){
      $('scrDesc').textContent='Đang nạp dữ liệu bộ lọc…';
      if(!await CPScreen.load()){ $('scrDesc').textContent='Không nạp được dữ liệu bộ lọc — thử tải lại trang.'; return; }
      $('scrDesc').textContent='';
      CPScreen.rebuild(scrVan);   // xếp hạng Piotroski/Greenblatt TRONG vũ trụ đã qua van
      scrBuild();
    }
    SCR.on=true;
  } else SCR.on=false;          // đóng panel = tắt lọc, bảng về nguyên trạng
  ST.page=1; render();
};
const scrVanChanged=()=>{ CPScreen.rebuild(scrVan); ST.page=1; render(); scrPaintCounts(); };
$('scrGtgd').onchange=e=>{ SCR.gtgd=+e.target.value; scrVanChanged(); };
$('scrMcap').onchange=e=>{ SCR.mcap=+e.target.value; scrVanChanged(); };
$('scrP10').onchange=e=>{ SCR.p10=e.target.checked; scrVanChanged(); };
$('scrRed').onchange=e=>{ SCR.red=e.target.checked; ST.page=1; render(); };
$('scrClear').onclick=()=>{
  SCR.chips.clear(); SCR.preset=null; SCR.red=false;
  SCR.gtgd=5e9; SCR.mcap=2e12; SCR.p10=true;
  $('scrGtgd').value='5e9'; $('scrMcap').value='2e12'; $('scrP10').checked=true; $('scrRed').checked=false;
  document.querySelectorAll('#scrChips button,#scrPre .pre').forEach(x=>x.classList.remove('on'));
  $('scrDesc').textContent='';
  CPScreen.rebuild(scrVan); ST.page=1; render(); scrPaintCounts();
};

/* giao diện sáng/tối — lưu lựa chọn, dùng chung cho các trang CPVN */
const thmBtn=$('thm');
function applyThmIcon(){ thmBtn.textContent=document.documentElement.dataset.theme==='light'?'☀️':'🌙'; }
thmBtn.onclick=()=>{
  const light=document.documentElement.dataset.theme!=='light';
  document.documentElement.dataset.theme=light?'light':'';
  localStorage.setItem('cpvn_theme',light?'light':'');
  applyThmIcon();
};
applyThmIcon();

(async function init(){
  await CP.loadBase();
  const cnt={};
  for(const c of CP.coins.values()) cnt[c.sector]=(cnt[c.sector]||0)+1;
  $('sector').innerHTML='<option value="all">Tất cả ngành</option>'+
    Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(s=>`<option>${CP.esc(s)}</option>`).join('');
  // tiêu đề cột LNST ghi rõ NĂM (lấy năm phổ biến nhất trong kho) -> tự đổi khi có BCTC năm mới
  const yc={}; for(const c of CP.coins.values()) if(c.npY) yc[c.npY]=(yc[c.npY]||0)+1;
  const yTop=Object.keys(yc).sort((a,b)=>yc[b]-yc[a])[0];
  if(yTop) $('thNp').textContent='LNST '+yTop;
  snapPrices(); render(); renderStats(); renderKho();
  CP.loadIndices().then(renderStats);
  // mỗi phút chỉ làm mới các mã của TRANG ĐANG XEM; 5 phút quét lại toàn bộ để xếp hạng đúng
  CP.startPolling(()=>{ flashUpdate(); },
    ()=>{ const st=(ST.page-1)*ST.PER; return ST.rows.slice(st,st+ST.PER).map(c=>c.sym); });
  setInterval(()=>{ CP.loadIndices().then(renderStats); },60000);
})();
</script>
