<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CPVN — Radar phiên · Đường đua vốn hoá</title>
<meta name="description" content="Bộ công cụ thị trường CPVN: radar tín hiệu phiên, đường đua vốn hoá 6,5 năm. Dữ liệu HOSE · HNX · UPCOM tự cập nhật mỗi phiên."/>
<script>(function(){/* MẶC ĐỊNH GIAO DIỆN SÁNG; chỉ theo lựa chọn đã lưu nếu người dùng từng đổi */
var t=localStorage.getItem('cpvn_theme');document.documentElement.dataset.theme=(t===null?'light':t);})();</script>
<link rel="icon" type="image/png" href="assets/logo-64.png?v=2"/>
<style>
/* ============================================================================
   CPVN LAB — xưởng tính năng. File độc lập, chỉ ĐỌC kho dữ liệu.
   Ngôn ngữ thiết kế: nền sâu, thẻ kính mờ, số to, ít viền, nhiều khoảng thở.
   ========================================================================== */
:root{
  --bg:#07070b; --bg2:#0b0b11;
  --card:rgba(17,17,26,.72); --card2:rgba(255,255,255,.03); --solid:#10101a;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.16);
  --txt:#ecedf4; --mut:#9092a3; --faint:#5d5f70;
  --rose:#f43f5e; --teal:#2dd4bf; --gold:#f5b40a; --violet:#a78bfa; --cyan:#38bdf8;
  --green:#16c784; --red:#ea3943; --yellow:#eab308; --purple:#c026d3;
  --greenD:rgba(22,199,132,.13); --redD:rgba(234,57,67,.13);
  --shadow:0 24px 60px rgba(0,0,0,.5);
  --r:18px;
}
html[data-theme="light"]{
  --bg:#eef0f4; --bg2:#f7f8fa;
  --card:rgba(255,255,255,.86); --card2:rgba(15,23,42,.035); --solid:#ffffff;
  --line:rgba(15,23,42,.09); --line2:rgba(15,23,42,.2);
  --txt:#101321; --mut:#5d6272; --faint:#9aa0af;
  --green:#0a9e63; --red:#dc3644; --yellow:#a16207; --purple:#9333ea;
  --greenD:rgba(10,158,99,.11); --redD:rgba(220,54,68,.1);
  --shadow:0 18px 44px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 480px at 12% -10%,rgba(244,63,94,.09),transparent 60%),
             radial-gradient(900px 520px at 95% 0%,rgba(45,212,191,.07),transparent 55%)}
html[data-theme="light"] body::before{
  background:radial-gradient(900px 480px at 12% -10%,rgba(244,63,94,.06),transparent 60%),
             radial-gradient(900px 520px at 95% 0%,rgba(45,212,191,.06),transparent 55%)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-variant-numeric:tabular-nums;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(128,128,150,.28);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.up{color:var(--green)}.dn{color:var(--red)}.fl{color:var(--yellow)}
.ce{color:var(--purple)}.fo{color:var(--cyan)}

/* ---------- tabs điều hướng chuẩn CPVN (6 mục, mobile cuộn ngang) ---------- */
.tabs{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:9px;overflow-x:auto;
  margin-left:12px;scrollbar-width:none;flex-shrink:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 13px;font-size:14px;font-weight:700;color:var(--mut);white-space:nowrap}
.tabs a.on{color:#fff;background:var(--rose)}
.tabs a:not(.on):hover{color:var(--txt)}

/* ---------- khung tổng ---------- */
html[data-theme="light"] header{background:rgba(247,248,250,.88)!important}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;
  padding:9px 13px;background:rgba(11,11,17,.85);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:.3px;color:#fff;flex:0 0 160px;overflow:hidden}
html[data-theme="light"] .brand{color:var(--txt)}
.brand b{color:inherit}
.brand img{width:30px;height:30px;border-radius:50%;filter:drop-shadow(0 0 9px rgba(45,212,191,.55))}
.brand .lab{font-size:10px;font-weight:900;letter-spacing:.16em;color:#2b1220;
  background:linear-gradient(120deg,var(--gold),var(--rose));padding:3px 7px;border-radius:6px;margin-left:2px}
.hsub{font-size:12px;color:var(--faint);margin-left:2px}
.spacer{flex:1}
.hchip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);
  border:1px solid var(--line);border-radius:20px;padding:5px 12px;background:var(--card2)}
.hchip b{font-size:13px}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:7px 12px;font-size:14px;cursor:pointer;transition:.15s}
.iconbtn:hover{border-color:var(--line2)}

#shell{display:block;min-height:calc(100vh - 55px)}
aside{width:236px;flex-shrink:0;padding:18px 12px 30px;border-right:1px solid var(--line);
  position:sticky;top:55px;height:calc(100vh - 55px);overflow-y:auto}
.ngrp{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;margin:16px 10px 7px}
.ngrp:first-child{margin-top:2px}
.nitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;
  font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;transition:.13s;
  border:1px solid transparent;margin-bottom:2px}
.nitem:hover{color:var(--txt);background:var(--card2)}
.nitem.on{color:var(--txt);background:var(--card);border-color:var(--line);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.nitem .ic{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.nitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .st{font-size:12px;color:var(--gold);flex-shrink:0}
main{min-width:0;padding:26px 28px 60px;max-width:1420px;margin:0 auto}
#mnav{display:none}

/* ---------- đầu mỗi module ---------- */
.mhead{margin-bottom:20px}
.mhead .eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:var(--rose);text-transform:uppercase}
.mhead h1{margin:5px 0 7px;font-size:30px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.mhead p{margin:0;color:var(--mut);font-size:14px;line-height:1.6;max-width:760px}
.mmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:13px}
.tagc{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;
  border:1px solid var(--line);color:var(--mut);background:var(--card2)}
.tagc.hi{color:var(--teal);border-color:rgba(45,212,191,.45)}
.tagc.vi{color:var(--gold);border-color:rgba(245,180,10,.45)}
.pickbtn{margin-left:auto;background:var(--card2);border:1.5px dashed var(--line2);border-radius:12px;
  padding:8px 16px;font-size:13px;font-weight:800;color:var(--mut);cursor:pointer;transition:.16s}
.pickbtn:hover{color:var(--txt);border-color:var(--gold)}
.pickbtn.on{background:linear-gradient(120deg,rgba(245,180,10,.16),rgba(244,63,94,.13));
  border:1.5px solid var(--gold);color:var(--gold)}

.mod{display:none;animation:fadeUp .28s ease both}
.mod.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ---------- thẻ / lưới ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(10px);overflow:hidden}
.panel>.ph{display:flex;align-items:center;gap:9px;padding:13px 16px;font-size:13px;font-weight:800;
  border-bottom:1px solid var(--line)}
.panel>.ph .cnt{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:700;
  border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.panel>.pb{padding:8px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.shotbtn{background:transparent;border:0;cursor:pointer;font-size:13px;color:var(--faint);padding:2px 5px}
.shotbtn:hover{color:var(--txt)}

/* dòng cổ phiếu trong thẻ */
.rw{display:grid;grid-template-columns:30px minmax(34px,1fr) minmax(0,74px) minmax(48px,auto) minmax(58px,auto);
  gap:8px;align-items:center;padding:7px 9px;border-radius:11px;transition:.12s}
.rw:hover{background:var(--card2)}
.rw{cursor:pointer}
.rw .lgw{width:28px;height:28px;border-radius:8px;background:#fff;overflow:hidden;display:flex;
  align-items:center;justify-content:center}
.rw img{width:100%;height:100%;object-fit:contain}
.rw .noimg{width:28px;height:28px;border-radius:8px;background:var(--card2);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;color:var(--mut)}
.rw .idn{min-width:0;line-height:1.22}
.rw .idn b{display:block;font-size:13.5px;font-weight:800}
.rw .idn i{display:block;font-style:normal;font-size:10.5px;color:var(--faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw canvas.rs{width:100%;height:26px;min-width:0}
.rw .pz{font-size:12.5px;font-weight:700;text-align:right}
.rw .mt{font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.empty{padding:24px 10px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------- điều khiển ---------- */
.ctl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.lb{font-size:10.5px;font-weight:900;letter-spacing:.09em;color:var(--faint);text-transform:uppercase}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--mut);padding:7px 13px;font-size:12.5px;
  font-weight:700;cursor:pointer;transition:.13s}
.seg button:hover{color:var(--txt)}
.seg button.on{background:var(--rose);color:#fff}
select,input[type=text],input[type=number],input[type=search]{background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:13.5px;outline:none}
select:focus,input:focus{border-color:var(--line2)}
.btn{background:linear-gradient(120deg,var(--rose),#e11d48);border:0;color:#fff;font-size:13px;
  font-weight:800;padding:9px 18px;border-radius:12px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn.gh{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.gh:hover{border-color:var(--line2)}
input[type=range]{accent-color:var(--teal)}

/* ---------- ô thống kê ---------- */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px}
.stat.stat2r{grid-template-columns:repeat(3,1fr)}   /* dàn thống kê radar: 2 hàng × 3 ô */
.stat>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .k{font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.3px}
.stat .s{font-size:11px;color:var(--mut);margin-top:1px}
.note{font-size:11.5px;color:var(--faint);line-height:1.65;margin-top:10px}
.warnline{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--mut);line-height:1.6;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin:12px 0}

/* ---------- bảng ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--solid);color:var(--faint);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:900;text-align:right;padding:10px 11px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr:hover{background:var(--card2)}
.tbl .l{text-align:left}
.tbl .co{display:flex;align-items:center;gap:9px}
.tbl .co .lgw{width:27px;height:27px;border-radius:8px;background:#fff;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.tbl .co img{width:100%;height:100%;object-fit:contain}
.tbl .co .noimg{width:27px;height:27px;border-radius:8px;background:var(--card2);display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mut);flex-shrink:0}
.tbl .co b{font-size:13.5px}
.tbl .co span{display:block;font-size:10.5px;color:var(--faint);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.scroll{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.dots{display:inline-flex;gap:2.5px;vertical-align:1px}
.dots i{width:7px;height:7px;border-radius:2.5px;background:var(--card2);border:1px solid var(--line);display:block}
.dots i.on{background:var(--green);border-color:transparent}
.badge{display:inline-block;min-width:60px;text-align:center;padding:2.5px 8px;border-radius:8px;
  font-weight:800;font-size:12px}
.badge.up{background:var(--greenD)}.badge.dn{background:var(--redD)}
.badge.fl{background:rgba(234,179,8,.12)}

/* ---------- radar hero ---------- */
.hero{display:grid;grid-template-columns:280px 1fr;gap:14px;margin-bottom:16px}
.hero .mood{padding:18px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative}
.hero .mood .big{font-size:52px;font-weight:900;letter-spacing:-2px;line-height:1}
.hero .mood .big small{font-size:16px;color:var(--faint);font-weight:700;letter-spacing:0}
.hero .mood .word{font-size:14px;font-weight:800}
.hero .mood .sub{font-size:11px;color:var(--faint)}
.bbar{height:8px;border-radius:5px;overflow:hidden;display:flex;background:var(--card2);margin:7px 0 3px}
.bbar i{height:100%}
.hero .story{padding:18px 20px;font-size:14px;line-height:1.85;color:var(--mut)}
.hero .story b{color:var(--txt);font-weight:700}
/* cột thông tin cạnh 2 nhịp đập (CHỈ desktop) */
.rrRow{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:4.5px 0;
  border-bottom:1px solid var(--line)}
.rrRow:last-child{border-bottom:0}
.rrRow span:first-child{color:var(--mut)}
.rrRow b{font-weight:800}
.rrRow .bdg{padding:2.5px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap}
.rrRow .bUp{background:var(--greenD);color:var(--green)}
.rrRow .bDn{background:var(--redD);color:var(--red)}
.rrRow .bFl{background:rgba(234,179,8,.13);color:var(--yellow)}
.rrRow .bGold{background:rgba(245,180,10,.14);color:var(--gold)}
.hero.h3c{grid-template-columns:minmax(220px,1fr) minmax(220px,1fr) minmax(250px,1.05fr)}
@media(max-width:1060px){ .hero .rrInfo{display:none!important} .hero.h3c{grid-template-columns:1fr} }
.hero .story .dt{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--rose);
  text-transform:uppercase;display:block;margin-bottom:5px}

/* ---------- tìm cơ hội ---------- */
.strats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;margin-bottom:16px}
.strat{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:13px 15px;
  cursor:pointer;transition:.15s;position:relative}
.strat:hover{border-color:var(--line2);transform:translateY(-1px)}
.strat.on{border-color:var(--teal);box-shadow:0 8px 26px rgba(45,212,191,.13)}
.strat h4{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;gap:7px;align-items:center}
.strat p{margin:0 0 8px;font-size:11px;color:var(--faint);line-height:1.5}
.strat .today{font-size:12px;font-weight:800;color:var(--teal)}
.strat .edge{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.strat .ec{font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line);color:var(--mut)}
.strat .ec.up{color:var(--green)}.strat .ec.dn{color:var(--red)}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.acc summary{padding:11px 15px;font-size:13px;font-weight:800;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:8px}
details.acc summary::after{content:'▾';margin-left:auto;color:var(--faint);transition:.2s}
details.acc[open] summary::after{transform:rotate(180deg)}
details.acc .accb{padding:4px 15px 14px;border-top:1px solid var(--line)}
.slider{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:5px 0}
.slider label{width:200px;color:var(--mut);flex-shrink:0}
.slider input{flex:1;min-width:80px}
.slider b{width:54px;text-align:right;color:var(--teal)}
.qsent{font-size:13px;color:var(--mut);margin:0 0 11px}
.qsent b{color:var(--teal)}

/* ---------- nhịp đập ---------- */
.meter{margin:9px 0}
.meter .mk{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.meter .mk b{font-weight:800}
.meter .mk i{font-style:normal;color:var(--faint);font-size:10.5px}
.meter .bar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden;position:relative}
.meter .bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}

/* ---------- canvas chung ---------- */
canvas.block{display:block;width:100%}

/* ---------- picks ---------- */
.pickrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;
  border:1px solid var(--line);background:var(--card);margin-bottom:9px}
.pickrow .ic{font-size:18px;width:26px;text-align:center}
.pickrow .nm{flex:1;min-width:0}
.pickrow .nm b{font-size:14px;display:block}
.pickrow .nm i{font-style:normal;font-size:11px;color:var(--faint)}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:11px;font-size:13px;line-height:1.6;min-height:90px;outline:none;resize:vertical}

/* ---------- tiêu đề khu vực trong module ---------- */
.secthead{display:flex;align-items:center;gap:11px;font-size:11px;font-weight:900;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin:24px 0 12px;scroll-margin-top:76px}
.secthead::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- bảng ngành trong radar ---------- */
.secrow{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(120px,1fr) 72px 92px;gap:10px;
  align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.secrow:first-child{border-top:0}
.secrow .sn{font-weight:700}
.secrow .sbr{position:relative;height:9px;background:var(--card2);border-radius:5px;overflow:hidden}
.secrow .sbr i.z{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.secrow .sbr i.b{position:absolute;top:0;bottom:0;border-radius:5px}
.secrow .sbr i.b.pos{left:50%;background:var(--green)}
.secrow .sbr i.b.neg{right:50%;background:var(--red)}
.secrow .sp{text-align:right;font-weight:800}
.secrow .sc{text-align:right;font-size:11px;color:var(--faint);white-space:nowrap}
@media(max-width:640px){
  .secrow{grid-template-columns:minmax(90px,1fr) 64px 84px}
  .secrow .sbr{display:none}
}

/* ---------- toast + loader ---------- */
#toast{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--solid);border:1px solid var(--line2);border-left:3px solid var(--teal);
  border-radius:12px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow);
  animation:sl .25s ease both;max-width:330px}
@keyframes sl{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#load{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;background:var(--bg);transition:opacity .35s}
#load.off{opacity:0;pointer-events:none}
#load img{width:52px;height:52px;border-radius:50%;animation:pulse 1.5s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(45,212,191,.4))}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 18px rgba(45,212,191,.8))}}
#load p{color:var(--mut);font-size:13px;margin:0}

footer{color:var(--faint);font-size:11.5px;text-align:center;padding:30px 18px 44px;line-height:1.9}
/* chế độ chụp ảnh: bỏ các lớp html2canvas vẽ sai (gradient nền phủ mờ, blur, toast) */
body.shotmode::before{display:none!important}
body.shotmode #toast,body.shotmode #htip{display:none!important}
body.shotmode header{backdrop-filter:none!important}
body.shotmode *{animation:none!important;transition:none!important}  /* clone chạy lại fadeUp -> ảnh trong suốt */

@media(max-width:1060px){
  #hDate,#hMood{display:none}
  header{padding:9px 11px;gap:8px;flex-wrap:wrap}
  .brand{font-size:17px}
  .brand img{width:25px;height:25px}
  /* tabs = hàng riêng cuộn ngang: Radar/Đường đua không bao giờ bị mất */
  .tabs{order:2;width:100%;margin-left:0}
  .tabs a{padding:8px 13px;font-size:13px;flex-shrink:0}
  .spacer{display:none}
  .iconbtn{margin-left:auto}
  main{padding:18px 14px 50px}
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .mhead h1{font-size:24px}
  .pickbtn{margin-left:0;width:100%}
  .duelrow{grid-template-columns:1fr 86px 1fr}
  .duelrow .bar{max-width:90px}
  #hm{height:70vh}
}
@media(max-width:640px){
  .g4{grid-template-columns:1fr}
  .stat{grid-template-columns:repeat(2,1fr)}
  .stat.stat2r{grid-template-columns:repeat(2,1fr)}
  .slider{flex-wrap:wrap}.slider label{width:100%}
}
</style>
</head>
