<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CPVN PRO — bản demo tính năng</title>
<meta name="robots" content="noindex" />
<script>(function(){var t=localStorage.getItem('cpvn_theme');if(t)document.documentElement.dataset.theme=t;})();</script>
<link rel="icon" type="image/png" href="assets/logo-64.png" />
<style>
/* ============================================================================
   CPVN PRO (DEMO) — file độc lập, không đụng vào index/banggia/cophieu/core/chart.
   Bảng màu kế thừa CPVN, thêm lớp "terminal": nền sâu hơn, viền mảnh, số tabular.
   ========================================================================== */
:root{
  --bg:#08080b; --bg2:#0b0b0f; --panel:#101016; --panel2:#16161d; --panel3:#1c1c25;
  --line:#22222c; --line2:#2e2e3a;
  --txt:#e9e9ef; --txt2:#b9b9c6; --muted:#7d7d8d; --faint:#55555f;
  --accent:#e11d48; --teal:#2dd4bf; --gold:#f0b429;
  --green:#16c784; --red:#ea3943; --yellow:#eab308; --purple:#c026d3; --cyan:#38bdf8;
  --greenD:rgba(22,199,132,.14); --redD:rgba(234,57,67,.14);
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60px);
  --grid:rgba(255,255,255,.06);
}
html[data-theme="light"]{
  --bg:#f2f4f7; --bg2:#ffffff; --panel:#ffffff; --panel2:#f5f6f9; --panel3:#e9ecf1;
  --line:#e2e6ed; --line2:#d3d9e2;
  --txt:#12141a; --txt2:#3d434f; --muted:#6b7280; --faint:#9aa1ad;
  --green:#0b9b61; --red:#dc3644; --yellow:#a16207; --purple:#9333ea; --cyan:#0369a1;
  --greenD:rgba(11,155,97,.12); --redD:rgba(220,54,68,.12);
  --shadow:0 14px 34px rgba(15,23,42,.10);
  --sheen:linear-gradient(180deg,rgba(0,0,0,.015),rgba(0,0,0,0) 60px);
  --grid:rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- thanh trên cùng ---------- */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:10px 18px;background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:800;letter-spacing:.4px;flex-shrink:0}
.brand img{width:28px;height:28px;border-radius:50%;filter:drop-shadow(0 0 8px rgba(45,212,191,.5))}
.brand .pro{font-size:10px;font-weight:800;letter-spacing:.14em;color:#04231f;background:var(--teal);
  padding:2px 6px;border-radius:5px;margin-left:2px;vertical-align:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex-shrink:0;background:transparent;border:0;color:var(--muted);font-size:13.5px;font-weight:700;
  padding:8px 13px;border-radius:9px;cursor:pointer;transition:.14s;white-space:nowrap}
nav.tabs button:hover{color:var(--txt);background:var(--panel2)}
nav.tabs button.on{color:#fff;background:var(--accent)}
html[data-theme="light"] nav.tabs button.on{color:#fff}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt2);border-radius:9px;
  padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.14s}
.iconbtn:hover{border-color:var(--line2);color:var(--txt)}
.iconbtn kbd{font-family:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;margin-left:6px}

/* ---------- dải chỉ số ---------- */
#mkt{display:flex;gap:0;align-items:stretch;padding:0 18px;background:var(--bg2);
  border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#mkt::-webkit-scrollbar{display:none}
.mi{display:flex;flex-direction:column;gap:1px;padding:9px 18px 9px 0;margin-right:18px;
  border-right:1px solid var(--line);flex-shrink:0;justify-content:center}
.mi:last-child{border-right:0}
.mi .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.mi .v{font-size:15px;font-weight:800;line-height:1.25}
.mi .s{font-size:11.5px;font-weight:700}
.bwrap{display:flex;align-items:center;gap:7px}
.bbar{width:118px;height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--panel3)}
.bbar i{height:100%}

/* ---------- khung nội dung ---------- */
main{max-width:1500px;margin:0 auto;padding:18px}
.mod{display:none;animation:fade .22s ease both}
.mod.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.modhead{margin:2px 0 15px}
.modhead h1{margin:0 0 4px;font-size:23px;font-weight:800;letter-spacing:-.3px}
.modhead p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;max-width:820px}
.evalbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ev{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--line);
  color:var(--muted);background:var(--panel)}
.ev.hi{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,transparent);
  background:color-mix(in srgb,var(--teal) 10%,transparent)}
.ev.vi{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent);
  background:color-mix(in srgb,var(--gold) 10%,transparent)}
.why{font-size:11.5px;font-weight:700;color:var(--accent);cursor:pointer;padding:3px 4px}
.whybox{display:none;margin-top:9px;padding:11px 13px;border-left:2px solid var(--accent);
  background:var(--panel);border-radius:0 10px 10px 0;font-size:13px;line-height:1.65;color:var(--txt2);max-width:900px}
.whybox.on{display:block}
.whybox b{color:var(--txt)}

/* ---------- thẻ ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0 0 auto;height:60px;background:var(--sheen);pointer-events:none}
.card>.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:12.5px;font-weight:800;position:relative}
.card>.ch .ic{font-size:14px}
.card>.ch .cnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--faint);
  border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.card>.cb{padding:6px 6px 8px}
.grid{display:grid;gap:13px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

/* ---------- dòng mã trong thẻ tín hiệu ---------- */
.row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;cursor:pointer;transition:.12s}
.row:hover{background:var(--panel2)}
.row .lg{width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain;flex-shrink:0}
.row .noimg{width:26px;height:26px;border-radius:7px;background:var(--panel3);display:flex;align-items:center;
  justify-content:center;font-size:10px;font-weight:800;color:var(--muted);flex-shrink:0}
.row .id{flex:1;min-width:0;line-height:1.25}
.row .sy{display:block;font-size:13.5px;font-weight:800}
.row .nm{display:block;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pz{font-size:12.5px;font-weight:700;text-align:right;width:60px;flex-shrink:0}
.row .mt{font-size:12px;font-weight:800;text-align:right;width:72px;flex-shrink:0}
.up{color:var(--green)} .dn{color:var(--red)} .fl{color:var(--yellow)}
.ce{color:var(--purple)} .fo{color:var(--cyan)}
.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:800}
.pill.up{background:var(--greenD)} .pill.dn{background:var(--redD)}
.empty{padding:22px 10px;text-align:center;color:var(--faint);font-size:12.5px}

/* ---------- điều khiển ---------- */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);padding:7px 12px;font-size:12.5px;
  font-weight:700;cursor:pointer;transition:.12s}
.seg button:hover{color:var(--txt);background:var(--panel2)}
.seg button.on{background:var(--accent);color:#fff}
select,input[type=text],input[type=number],input[type=search]{background:var(--panel);color:var(--txt);
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--line2)}
label.lb{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}

/* ---------- bản đồ nhiệt ---------- */
#tmap{position:relative;width:100%;height:640px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:var(--panel)}
.tgrp{position:absolute;overflow:hidden}
.tgrp>.gl{position:absolute;top:0;left:0;right:0;height:17px;font-size:10px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);padding:3px 6px 0;
  background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tile{position:absolute;border:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:filter .12s}
html[data-theme="light"] .tile{border-color:rgba(255,255,255,.5)}
.tile:hover{filter:brightness(1.28);z-index:3}
.tile b{font-weight:800;line-height:1.05;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.tile i{font-style:normal;color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.45)}
#ttip{position:fixed;z-index:60;display:none;pointer-events:none;background:var(--panel);
  border:1px solid var(--line2);border-radius:11px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);min-width:186px}
#ttip .t{font-size:14px;font-weight:800;margin-bottom:3px}
#ttip .r{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0;color:var(--muted)}
#ttip .r b{color:var(--txt);font-weight:700}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-left:auto}
.legend i{width:22px;height:11px;border-radius:2px;display:inline-block}

/* ---------- bảng ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:800;text-align:right;padding:9px 11px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:2}
.tbl thead th:hover{color:var(--txt)}
.tbl thead th.srt{color:var(--gold)}
.tbl tbody td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl .l{text-align:left}
.tbl .co{display:flex;align-items:center;gap:9px}
.tbl .co img,.tbl .co .noimg{width:26px;height:26px;border-radius:7px;background:#fff;object-fit:contain;flex-shrink:0}
.tbl .co .noimg{background:var(--panel3);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--muted)}
.tbl .co b{font-size:13.5px} .tbl .co span{display:block;font-size:11px;color:var(--muted);
  max-width:190px;overflow:hidden;text-overflow:ellipsis}
.scroll{max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.rsbar{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--panel3);
  overflow:hidden;vertical-align:1px;margin-right:6px}
.rsbar i{display:block;height:100%}

/* ---------- bộ lọc ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:11px;
  padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f .fr{display:flex;gap:6px;align-items:center}
.f .fr input{width:100%;padding:6px 8px;font-size:12.5px}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.preset{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:7px 14px;
  font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer;transition:.14s}
.preset:hover{border-color:var(--teal);color:var(--txt)}
.preset.on{background:var(--teal);border-color:var(--teal);color:#04231f}
.qsent{font-size:12.5px;color:var(--muted);margin-bottom:11px;line-height:1.6}
.qsent b{color:var(--teal);font-weight:700}

/* ---------- biểu đồ ---------- */
.chartwrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cvMain{display:block;width:100%;height:520px;cursor:crosshair;touch-action:pan-y}
#cvTip{position:absolute;display:none;pointer-events:none;z-index:9;background:var(--panel2);
  border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:11.5px;line-height:1.7;
  box-shadow:var(--shadow);min-width:158px}
#cvTip .hd{font-weight:800;font-size:12px;display:block;margin-bottom:3px}
#cvTip .r{display:flex;justify-content:space-between;gap:13px}
#cvTip .r i{font-style:normal;color:var(--muted)}
#cvTip .r span{font-weight:700}
.zoomctl{position:absolute;right:70px;top:9px;display:flex;gap:4px;z-index:8}
.zoomctl button{width:27px;height:27px;border-radius:8px;background:var(--panel2);color:var(--muted);
  border:1px solid var(--line);font-size:14px;font-weight:800;cursor:pointer;line-height:1;padding:0}
.zoomctl button:hover{color:var(--txt);border-color:var(--line2)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--muted);
  padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:.12s}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip.on{background:var(--panel3);color:var(--txt);border-color:var(--line2)}
.chip.on.ma20{color:var(--yellow)} .chip.on.ma50{color:var(--cyan)} .chip.on.ma200{color:var(--purple)}
.chip.on.bb{color:var(--teal)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:11px;margin-top:13px}
.kpi>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .k{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi .v{font-size:17px;font-weight:800;margin-top:3px}

/* ---------- danh mục / cảnh báo ---------- */
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.form .f{min-width:112px}
.btn{background:var(--accent);border:0;color:#fff;font-size:13px;font-weight:800;padding:8px 16px;
  border-radius:10px;cursor:pointer;transition:.14s}
.btn:hover{filter:brightness(1.1)}
.btn.gh{background:var(--panel);border:1px solid var(--line);color:var(--txt2)}
.btn.gh:hover{border-color:var(--line2);color:var(--txt)}
.del{color:var(--faint);cursor:pointer;font-weight:800;padding:0 6px}
.del:hover{color:var(--red)}
.donut{width:150px;height:150px;flex-shrink:0}

/* ---------- lộ trình ---------- */
.rmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.rm{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rm h4{margin:0 0 5px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.rm .no{font-size:11px;font-weight:800;color:var(--faint);border:1px solid var(--line);
  border-radius:6px;padding:1px 6px}
.rm p{margin:0 0 9px;font-size:12.5px;line-height:1.65;color:var(--muted)}
.rm .tags{display:flex;gap:6px;flex-wrap:wrap}
.rm .tg{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--panel2);
  color:var(--muted);border:1px solid var(--line)}
.rm .tg.p1{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.rm .tg.p2{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.rm .tg.p3{color:var(--muted)}
.rm .tg.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.secthead{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin:22px 0 11px;display:flex;align-items:center;gap:10px}
.secthead::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- bảng lệnh nhanh ⌘K ---------- */
#pal{position:fixed;inset:0;z-index:80;display:none;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
#pal.on{display:block}
#palbox{max-width:560px;margin:11vh auto 0;background:var(--panel);border:1px solid var(--line2);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
#palin{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:16px;background:transparent}
#palres{max-height:390px;overflow:auto;padding:6px}
.pr{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.pr.sel{background:var(--panel3)}
.pr .tag{margin-left:auto;font-size:10.5px;color:var(--faint);font-weight:700}
.pr b{font-weight:800;width:48px}
.pr span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- toast ---------- */
#toast{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.tst{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--teal);
  border-radius:11px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow);animation:sl .25s ease both;max-width:330px}
@keyframes sl{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

#load{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:var(--bg);transition:opacity .3s}
#load.off{opacity:0;pointer-events:none}
#load .sp{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--teal);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load p{color:var(--muted);font-size:13px;margin:0}

footer{color:var(--faint);font-size:11.5px;text-align:center;padding:26px 18px 40px;line-height:1.8}

@media(max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:700px){
  header{padding:9px 12px;gap:8px;flex-wrap:wrap}
  .brand{font-size:17px}
  nav.tabs{order:9;width:100%;flex:1 0 100%}
  main{padding:13px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  #tmap{height:520px}
  #cvMain{height:400px}
  .modhead h1{font-size:20px}
  .mi{padding-right:13px;margin-right:13px}
}
</style>
</head>
<body>

<div id="load"><div class="sp"></div><p>Đang nạp kho dữ liệu CPVN…</p></div>

<header>
  <a class="brand" href="#" onclick="return false"><img src="assets/logo-128.png" alt=""/>
    <span>CPVN<span class="pro">PRO</span></span></a>
  <nav class="tabs" id="tabs"></nav>
  <button class="iconbtn" id="btnPal">Tìm mã<kbd>⌘K</kbd></button>
  <button class="iconbtn" id="btnThm">🌙</button>
</header>

<div id="mkt"></div>

<main>
  <section class="mod" id="m-radar"></section>
  <section class="mod" id="m-heat"></section>
  <section class="mod" id="m-screen"></section>
  <section class="mod" id="m-chart"></section>
