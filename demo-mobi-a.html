<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CPVN — Demo mobile A · Bảng điện</title>
<link rel="icon" type="image/png" href="assets/logo-64.png?v=3"/>
<style>
/* ============================================================================
   DEMO MOBILE — MẪU A "BẢNG ĐIỆN"
   Đậm đặc, nền tối, dành cho người mở app ngày mấy chục lần và quét nhiều mã.

   BA QUYẾT ĐỊNH GỐC, đều rút từ thói quen số đông chứ không phải sở thích:
   1. ĐIỀU HƯỚNG XUỐNG ĐÁY. Cầm một tay thì ngón cái với thoải mái vùng dưới,
      còn hai góc trên là chỗ khó với nhất. Menu đang nằm trên đỉnh + xổ ra khi
      RÊ CHUỘT — mà trên điện thoại không hề có thao tác rê.
   2. BA CỘT, KHÔNG HƠN. Màn hẹp thì mắt bám mép trái (biết đang xem mã nào) và
      mép phải (con số quyết định). Khúc giữa là vùng chết. Nhồi 6 cột như bản
      desktop thì cột nào cũng phải bóp, đọc số nào cũng phải căng mắt.
   3. SỐ PHẢI SO ĐƯỢC. Cùng bề rộng chữ số (tabular-nums), cùng số lẻ, cùng mép
      phải — mắt so hàng dọc trong một nhịp, không phải đọc từng số một.
   ========================================================================== */

/* ---------------- THANG CHỮ: 6 bậc, phân biệt bằng ĐỘ ĐẬM là chính ---------
   Dữ liệu dày mà tăng cỡ chữ để nhấn thì vỡ bố cục. Nên chênh lệch chủ yếu do
   độ đậm và màu; cỡ chỉ nhảy khi thật sự đổi vai trò. */
:root{
  --f1:11px;   /* nhãn cột, chữ hoa, giãn chữ */
  --f2:12.5px; /* phụ chú: sàn, ngành, ngày */
  --f3:14px;   /* số phụ: %, GTGD */
  --f4:15.5px; /* mã + giá — bậc chính của hàng */
  --f5:17px;   /* số nổi trong thẻ */
  --f6:22px;   /* tiêu đề màn */
  --f7:30px;   /* giá lớn trang cổ phiếu */
  --w-norm:450; --w-med:600; --w-bold:700; --w-black:800;
  --r:12px; --r-lg:16px;
  --tap:44px;  /* cạnh nhỏ nhất của mọi thứ bấm được */
}

/* ---------------- MÀU ------------------------------------------------------
   Xanh dương là màu được nhiều người chọn là "màu tôi thích nhất" hơn bất kỳ
   màu nào khác, gần như ở mọi nước và cả hai giới — nên lấy làm màu thương hiệu
   / màu đang-chọn. Nhưng MÀU GIÁ thì không được đụng: xanh lá tăng, đỏ giảm,
   tím trần, xanh lơ sàn, vàng tham chiếu — dân sàn VN đọc theo phản xạ. */
.dark{
  --bg:#1b2130; --bg2:#161b28; --pan:#232b3d; --pan2:#2b3448; --line:#37415a;
  --txt:#e9edf6; --mut:#98a4bc; --mut2:#78849c;
  --acc:#5b93ff; --acc-bg:rgba(91,147,255,.15); --acc-line:rgba(91,147,255,.45);
  --up:#22c98a; --dn:#f0505c; --ref:#eab308; --cei:#c084fc; --flo:#22d3ee;
  --up-bg:rgba(34,201,138,.14); --dn-bg:rgba(240,80,92,.14);
  --sh:0 6px 20px rgba(0,0,0,.35);
}
.light{
  --bg:#f1f4f9; --bg2:#e7ecf4; --pan:#ffffff; --pan2:#f4f7fb; --line:#dde4ee;
  --txt:#131a26; --mut:#5c6880; --mut2:#7d879b;
  --acc:#2563eb; --acc-bg:rgba(37,99,235,.1); --acc-line:rgba(37,99,235,.4);
  --up:#0f9d58; --dn:#d92c3c; --ref:#c98a00; --cei:#9333ea; --flo:#0891b2;
  --up-bg:rgba(15,157,88,.1); --dn-bg:rgba(217,44,60,.1);
  --sh:0 6px 20px rgba(15,23,42,.09);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0b0e14;color:#e9edf6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* ---- khung máy: chỉ hiện trên máy bàn, còn trên điện thoại thì phủ kín ---- */
.tray{min-height:100%}
.tray>.note{display:none}
.phone{width:100%;height:100dvh;overflow:hidden;position:relative;background:var(--bg);color:var(--txt)}
@media(min-width:820px){
  body{background:radial-gradient(1200px 700px at 50% -10%,#1e2740,#0b0e14)}
  .tray{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:26px 0 40px}
  .tray>.note{display:block;text-align:center;max-width:640px;color:#93a2bd;font-size:13.5px;line-height:1.65}
  .tray>.note b{color:#e9edf6}
  .phone{width:390px;height:820px;border-radius:46px;border:11px solid #0e1118;
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 2px #262d3d}
}

/* ---- vỏ ứng dụng ---- */
.app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-bottom:16px}

/* ---- ĐẦU TRANG: mảnh hết mức. Chỉ giữ thứ luôn cần: chỉ số + hai nút ---- */
.top{background:var(--pan);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tbar{display:flex;align-items:center;gap:9px;padding:9px 13px;height:52px}
.brand{font-size:15px;font-weight:var(--w-black);letter-spacing:.2px}
.brand em{font-style:normal;color:var(--acc)}
.tbar .sp{flex:1}
.ico{width:var(--tap);height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:var(--pan2);border:1px solid var(--line);font-size:12.5px;
  font-weight:var(--w-bold);gap:5px;padding:0 10px;width:auto}
.ico.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc)}

/* dải chỉ số: cuộn ngang, mỗi chip là một khối đọc trọn vẹn */
.idxrow{display:flex;gap:7px;padding:8px 13px 9px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);background:var(--bg2)}
.idxrow::-webkit-scrollbar{display:none}
.chipx{flex:0 0 auto;background:var(--pan);border:1px solid var(--line);border-radius:11px;
  padding:6px 10px;min-width:104px}
.chipx .k{font-size:var(--f1);font-weight:var(--w-black);color:var(--mut2);letter-spacing:.06em}
.chipx .v{font-size:var(--f4);font-weight:var(--w-black);margin-top:1px;line-height:1.15}
.chipx .c{font-size:var(--f2);font-weight:var(--w-bold)}

/* ---- THANH TAB ĐÁY: 5 mục, đúng vùng ngón cái với tới ---- */
.tabbar{display:flex;background:var(--pan);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tabbar button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--mut2);font-size:10.5px;font-weight:var(--w-bold);
  position:relative;padding-top:3px}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--acc)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2.5px;
  background:var(--acc);border-radius:0 0 3px 3px}

/* ---- thanh mục con: chỉ hiện ở tab nào thật sự có mục con ---- */
.subs{display:flex;gap:6px;padding:9px 13px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);background:var(--bg)}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:0 0 auto;height:32px;padding:0 13px;border-radius:16px;background:var(--pan);
  border:1px solid var(--line);font-size:var(--f3);font-weight:var(--w-bold);color:var(--mut)}
.subs button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- ĐẦU BẢNG + HÀNG MÃ: xương sống của mẫu này ------------------------- */
.thead{display:grid;grid-template-columns:1fr 96px 72px;gap:8px;padding:8px 13px;
  background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;
  font-size:var(--f1);font-weight:var(--w-black);letter-spacing:.06em;color:var(--mut2);
  text-transform:uppercase}
.thead b{font-weight:var(--w-black);text-align:right;display:flex;align-items:center;
  justify-content:flex-end;gap:3px}
.thead b.act{color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 96px 72px;gap:8px;align-items:center;
  padding:0 13px;min-height:56px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:active{background:var(--pan2)}
.co{display:flex;align-items:center;gap:9px;min-width:0}
.co .s,.co .n,.px .p,.px .g{display:block}
.lg{width:28px;height:28px;border-radius:8px;flex:0 0 auto;object-fit:contain;background:#fff;padding:1px}
.lgi{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;background:var(--pan2);color:var(--mut);font-size:10px;font-weight:var(--w-black)}
.co .id{min-width:0}
.co .s{font-size:var(--f4);font-weight:var(--w-black);letter-spacing:.2px;line-height:1.2}
.co .n{font-size:var(--f2);color:var(--mut2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:150px;line-height:1.25;margin-top:1px}
.px{text-align:right}
.px .p{font-size:var(--f4);font-weight:var(--w-bold);line-height:1.2;white-space:nowrap}
.px .g{font-size:var(--f2);color:var(--mut2);margin-top:1px;white-space:nowrap}
.pc{text-align:right;font-size:var(--f3);font-weight:var(--w-black);border-radius:8px;
  padding:5px 0}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--ref)}
.pc.up{background:var(--up-bg)}.pc.dn{background:var(--dn-bg)}
.pc.fl{background:rgba(234,179,8,.14)}

/* ---- thẻ dùng chung ---- */
.card{background:var(--pan);border:1px solid var(--line);border-radius:var(--r-lg);
  margin:12px 13px;overflow:hidden}
.card>.h{display:flex;align-items:center;gap:8px;padding:12px 13px 0}
.card>.h .t{font-size:var(--f4);font-weight:var(--w-black)}
.card>.h .s{font-size:var(--f2);color:var(--mut2);margin-left:auto}
.card>.b{padding:11px 13px 13px}
.lab{font-size:var(--f1);font-weight:var(--w-black);letter-spacing:.06em;color:var(--mut2);
  text-transform:uppercase}
.big{font-size:var(--f6);font-weight:var(--w-black);line-height:1.15}
.hint{padding:10px 15px 2px;font-size:var(--f2);color:var(--mut2);line-height:1.55}
.h2{padding:14px 13px 6px;font-size:var(--f6);font-weight:var(--w-black);letter-spacing:-.2px}
.h2 span{display:block;font-size:var(--f2);font-weight:var(--w-med);color:var(--mut2);
  letter-spacing:0;margin-top:2px}

/* ---- lưới chỉ số 2 cột ---- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.g2>div{background:var(--pan);padding:10px 12px}
.g2 .k{font-size:var(--f1);font-weight:var(--w-black);color:var(--mut2);letter-spacing:.05em;
  text-transform:uppercase}
.g2 .v{font-size:var(--f5);font-weight:var(--w-black);margin-top:2px}

/* ---- tấm trượt lên từ đáy (bộ lọc, lịch cổ tức) ------------------------- */
.mask{position:absolute;inset:0;background:rgba(5,8,14,.6);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .18s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--pan);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:82%;
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 3px}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 15px 11px;border-bottom:1px solid var(--line)}
.sheet .sh .t{font-size:var(--f5);font-weight:var(--w-black)}
.sheet .sh .x{margin-left:auto;width:32px;height:32px;border-radius:10px;background:var(--pan2);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--mut)}
.sheet .sb{overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}

/* ---- chip lọc ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:11px 15px}
.chips button{height:34px;padding:0 13px;border-radius:17px;background:var(--pan2);
  border:1px solid var(--line);font-size:var(--f3);font-weight:var(--w-bold);color:var(--mut)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- hàng cổ tức ---- */
.ctr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:10px 15px;border-bottom:1px solid var(--line)}
.ctr .d{font-size:var(--f2);color:var(--mut2);margin-top:2px}
.ctr .r{text-align:right}
.ctr .r .v{font-size:var(--f4);font-weight:var(--w-black)}
.ctr .r .k{font-size:var(--f1);font-weight:var(--w-bold);color:var(--mut2);text-transform:uppercase;
  letter-spacing:.05em}
.dday{padding:7px 15px;background:var(--bg2);font-size:var(--f2);font-weight:var(--w-black);
  color:var(--mut);position:sticky;top:0;border-bottom:1px solid var(--line)}

/* ---- tập đoàn ---- */
.tdg{border-bottom:1px solid var(--line)}
.tdh{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 13px;width:100%;text-align:left}
.tdh .nm{font-size:var(--f4);font-weight:var(--w-black);line-height:1.25}
.tdh .mt{font-size:var(--f2);color:var(--mut2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:var(--w-black);padding:2px 6px;border-radius:5px;letter-spacing:.03em;
  background:var(--pan2);color:var(--mut);white-space:nowrap}
.tag.nn{background:rgba(91,147,255,.16);color:var(--acc)}
.tag.cn{background:rgba(234,179,8,.16);color:var(--ref)}
.tdb{background:var(--bg2);border-top:1px solid var(--line)}
.tdr{display:grid;grid-template-columns:1fr 74px 66px;gap:8px;align-items:center;
  padding:9px 13px 9px 26px;border-bottom:1px solid var(--line);position:relative;font-size:var(--f3)}
.tdr::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:1.5px;background:var(--line)}
.tdr:last-child{border-bottom:0}
.tdr .s{font-weight:var(--w-black);font-size:var(--f4)}
.tdr .own{font-size:var(--f2);color:var(--mut2)}
.tdr .n1,.tdr .n2{text-align:right;font-weight:var(--w-bold)}

/* ---- Venn chủ điểm ---- */
.venn{display:block;margin:0 auto;max-width:100%}
.src{margin:10px 13px 0;padding:9px 12px;border-radius:10px;background:var(--acc-bg);
  border:1px solid var(--acc-line);font-size:var(--f2);color:var(--txt);line-height:1.55}
.src b{color:var(--acc)}

/* ---- thanh ngang so sánh ---- */
.bar{height:7px;border-radius:4px;background:var(--pan2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}

/* ---- trang cổ phiếu ---- */
.cph{padding:13px 13px 11px;background:var(--pan);border-bottom:1px solid var(--line)}
.cph .r1{display:flex;align-items:center;gap:10px}
.cph .r1 .lg,.cph .r1 .lgi{width:38px;height:38px;border-radius:11px;font-size:12px}
.cph .nm{font-size:var(--f2);color:var(--mut2);margin-top:2px}
.cph .s{font-size:var(--f5);font-weight:var(--w-black);letter-spacing:.3px}
.cph .pxb{display:flex;align-items:flex-end;gap:9px;margin-top:11px}
.cph .pxb .p{font-size:var(--f7);font-weight:var(--w-black);letter-spacing:-.6px;line-height:1}
.cph .pxb .c{font-size:var(--f4);font-weight:var(--w-black);padding-bottom:3px}
.mini{display:flex;gap:6px;padding:9px 13px;overflow-x:auto;scrollbar-width:none}
.mini::-webkit-scrollbar{display:none}
.mini button{flex:0 0 auto;height:30px;padding:0 12px;border-radius:8px;background:var(--pan2);
  border:1px solid var(--line);font-size:var(--f2);font-weight:var(--w-bold);color:var(--mut)}
.mini button.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc)}
.fin{padding:2px 13px 13px}
.finr{display:grid;grid-template-columns:52px 1fr 78px;gap:9px;align-items:center;
  padding:7px 0;font-size:var(--f3)}
.finr .y{color:var(--mut2);font-weight:var(--w-bold)}
.finr .v{text-align:right;font-weight:var(--w-black)}

/* ---- nút đổi mẫu / đổi đèn, nổi trên cùng ---- */
/* Nút đổi mẫu A/B + đổi đèn — chỉ là đồ nghề của bản demo, không thuộc thiết kế.
   Dán xuống góc trái dưới để không đè lên hai nút thật ở đầu trang. */
.ab{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:90;display:flex;gap:6px}
.ab a,.ab button{height:28px;padding:0 10px;border-radius:8px;background:rgba(10,14,24,.84);
  color:#e9edf6;border:1px solid rgba(255,255,255,.18);font-size:11.5px;font-weight:var(--w-black);
  display:flex;align-items:center;text-decoration:none;backdrop-filter:blur(8px);
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ab a.on{background:#5b93ff;border-color:#5b93ff;color:#fff}
</style>
</head>
<body>

<div class="tray">
  <p class="note"><b>Mẫu A · “Bảng điện”</b> — nền tối, đậm đặc, điều hướng dồn xuống đáy cho vừa tầm ngón cái.
  Bấm thử mọi tab, bấm một mã để mở trang cổ phiếu, bấm <b>Lọc</b> và <b>Cổ tức</b> để xem tấm trượt.
  Mở trên điện thoại thì khung máy này biến mất, giao diện phủ kín màn.</p>

  <div class="phone dark" id="ph">
    <div class="ab">
      <a href="demo-mobi-a.html" class="on">A</a>
      <a href="demo-mobi-b.html">B</a>
      <button id="lamp">🌙</button>
    </div>
    <div class="app">
      <div class="top" id="top"></div>
      <div class="body" id="body"></div>
      <nav class="tabbar" id="tabs"></nav>
    </div>
    <div class="mask" id="mask"></div>
    <div class="sheet" id="sheet"><div class="grab"></div><div class="sh"></div><div class="sb"></div></div>
  </div>
</div>

<script>
/* ========================================================================== */
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2)+'%';
const cls=x=>x==null?'':x>0.0001?'up':x<-0.0001?'dn':'fl';
/* Vốn hoá tập đoàn chạm hàng TRIỆU tỷ (riêng VIC đã ~1,6 triệu tỷ). Cột hẹp thì rút
   gọn N = nghìn tỷ, Tr = triệu tỷ; chỗ nào rộng thì viết chữ cho khỏi phải đoán. */
const ty=v=>v==null?'—':Math.abs(v)>=1e6?nf(v/1e6,2)+'Tr':Math.abs(v)>=1000?nf(v/1000,1)+'N':nf(v);
const tyD=v=>v==null?'—':Math.abs(v)>=1e6?nf(v/1e6,2)+' triệu tỷ'
  :Math.abs(v)>=1000?nf(v/1000,1)+' nghìn tỷ':nf(v)+' tỷ';
const logo=s=>`<img class="lg" src="assets/logo/${s}.webp" loading="lazy" alt=""
  onerror="this.outerHTML='<span class=lgi>${s.slice(0,3)}</span>'">`;

function spark(a,w,h,c){
  if(!a||a.length<2) return '';
  const mn=Math.min(...a),mx=Math.max(...a),d=(mx-mn)||1;
  const p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-(v-mn)/d*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    <polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ========================= MÀN 2 · BONG BÓNG ============================== */
function mBong(){
  const W=352,H=430,pad=4;
  const list=D.bigs.slice(0,44);
  const mx=Math.max(...list.map(x=>x.mc));
  const put=[];
  list.forEach(c=>{
    const r=Math.max(15,Math.sqrt(c.mc/mx)*54);
    /* xoáy ốc từ tâm ra: tìm chỗ trống đầu tiên không đè lên bóng đã đặt */
    let ok=null;
    for(let k=0;k<3000&&!ok;k++){
      const a=k*0.55, rad=3.2*Math.sqrt(k)*1.9;
      const x=W/2+rad*Math.cos(a), y=H/2+rad*Math.sin(a);
      if(x-r<pad||x+r>W-pad||y-r<pad||y+r>H-pad) continue;
      if(put.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+r+2.5)) ok={x,y};
    }
    if(ok) put.push({...ok,r,c});
  });
  const col=v=>v>2?'var(--up)':v>0?'rgba(34,201,138,.72)':v<-2?'var(--dn)':v<0?'rgba(240,80,92,.72)':'var(--ref)';
  const bub=put.map(p=>`<g>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}"
        fill="${col(p.c.chg)}" fill-opacity=".2" stroke="${col(p.c.chg)}" stroke-width="1.4"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-1).toFixed(1)}" text-anchor="middle"
        font-size="${Math.min(13,Math.max(8,p.r/2.5)).toFixed(0)}" font-weight="800"
        fill="var(--txt)">${p.c.s}</text>
      ${p.r>21?`<text x="${p.x.toFixed(1)}" y="${(p.y+11).toFixed(1)}" text-anchor="middle"
        font-size="9.5" font-weight="700" fill="${col(p.c.chg)}">${pc(p.c.chg)}</text>`:''}
    </g>`).join('');
  return `<div class="h2">Bản đồ bong bóng<span>Bóng to = vốn hoá lớn · màu = biến động phiên ${D.date}</span></div>
    <div class="card"><div class="b" style="padding:6px">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bub}</svg></div></div>
    <div class="chips">${['Vốn hoá','1 ngày','1 tuần','1 năm','Khối ngoại'].map((t,i)=>
      `<button class="${i===1?'on':''}">${t}</button>`).join('')}</div>
    <div class="hint">Trên màn hẹp thì bóng dưới 15px không đọc nổi chữ, nên bản mobile
      chỉ vẽ ${put.length} mã lớn nhất và cho lọc theo ngành thay vì nhồi hết ${nf(D.nSyms)} mã.</div>`;
}

function gauge(v,lab){
  const a=(v/100)*180-180, R=64, cx=84, cy=76;
  const x=cx+R*Math.cos(a*Math.PI/180), y=cy+R*Math.sin(a*Math.PI/180);
  const c=v>=75?'var(--up)':v>=55?'#84cc16':v>=45?'var(--ref)':v>=25?'#fb923c':'var(--dn)';
  return `<svg viewBox="0 0 168 96" width="168" height="96">
    <path d="M20 76a64 64 0 0 1 128 0" fill="none" stroke="var(--pan2)" stroke-width="13" stroke-linecap="round"/>
    <path d="M20 76a64 64 0 0 1 128 0" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${(v/100*201).toFixed(0)} 400"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${c}" stroke="var(--pan)" stroke-width="2.5"/>
    <text x="84" y="70" text-anchor="middle" font-size="27" font-weight="800" fill="var(--txt)">${Math.round(v)}</text>
    <text x="84" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--mut2)">${lab}</text>
  </svg>`;
}

/* Ba vòng đặt theo tam giác đều — có vậy bảy vùng mới đủ rộng để nhét chữ.
   Vòng 0 (tăng trưởng) trên, vòng 1 (nâng hạng) trái dưới, vòng 2 (định giá) phải dưới.
   Chỗ đặt chữ tính tay theo hình: giao ba ở trọng tâm, giao đôi đẩy ra xa vòng thứ
   ba, phần riêng đẩy hẳn ra rìa. Chú thích màu tách xuống HTML để không đè lên chữ. */
function vennSVG(){
  const T=D.cd.truc, W=352,H=266, R=82, cx=176;
  const P=[[cx,99],[cx-44,175],[cx+44,175]];
  const NEO={'dg|nh|tt':[cx,154],'nh|tt':[126,121],'dg|tt':[226,121],'dg|nh':[cx,207],
             'tt':[cx,53],'nh':[92,192],'dg':[260,192]};
  const key=m=>m.truc.slice().sort().join('|'), grp={};
  D.cd.ma.forEach(m=>(grp[key(m)]=grp[key(m)]||[]).push(m.s));
  const lab=Object.entries(grp).map(([k,arr])=>{
    const p=NEO[k]||[cx,154], L=[];
    for(let i=0;i<arr.length;i+=2) L.push(arr.slice(i,i+2).join(' '));
    return L.map((l,i)=>`<text x="${p[0]}" y="${p[1]+i*14-(L.length-1)*7}"
      text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--txt)">${l}</text>`).join('');
  }).join('');
  return `<svg class="venn" viewBox="0 0 ${W} ${H}" width="100%">
    ${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${R}" fill="${T[i].mau}" fill-opacity=".17"
      stroke="${T[i].mau}" stroke-width="1.6"/>`).join('')}${lab}</svg>
    <div style="display:flex;flex-wrap:wrap;gap:9px 14px;padding:8px 4px 2px">
      ${T.map(t=>`<span style="display:flex;align-items:center;gap:6px;font-size:var(--f2);
        font-weight:700;color:var(--mut)">
        <i style="width:10px;height:10px;border-radius:50%;background:${t.mau};
          display:inline-block"></i>${esc(t.ten)}</span>`).join('')}</div>`;
}

/* ========================= MÀN 4 · ĐƯỜNG ĐUA ============================== */
function mDua(){
  const S6=D.race.sec, n=S6[0].d.length;
  const all=S6.flatMap(s=>s.d), mn=Math.min(...all), mx=Math.max(...all);
  const W=340,H=190,PL=4,PR=4;
  const px=i=>PL+i/(n-1)*(W-PL-PR), py=v=>H-((v-mn)/(mx-mn))*(H-14)-7;
  const CO=['#5b93ff','#22c98a','#f0505c','#eab308','#c084fc','#22d3ee','#fb923c'];
  const lines=S6.map((s,i)=>`<polyline fill="none" stroke="${CO[i%7]}" stroke-width="2"
    stroke-linejoin="round" points="${s.d.map((v,j)=>px(j).toFixed(1)+','+py(v).toFixed(1)).join(' ')}"/>`).join('');
  const rank=S6.map((s,i)=>({...s,i})).sort((a,b)=>b.d[n-1]-a.d[n-1]);
  return `<div class="h2">Đường đua vốn hoá<span>Ba năm gần nhất · mốc 100 ở điểm xuất phát</span></div>
    <div class="card"><div class="b" style="padding:8px 6px 4px">
      <svg viewBox="0 0 ${W} ${H}" width="100%">
        ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${(7+f*(H-14)).toFixed(0)}"
          y2="${(7+f*(H-14)).toFixed(0)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
        ${lines}</svg></div></div>
    ${rank.map((s,k)=>`<div class="tdg"><div class="tdh">
        <div><div class="nm" style="display:flex;align-items:center;gap:7px">
          <i style="width:9px;height:9px;border-radius:3px;background:${CO[s.i%7]};display:inline-block"></i>
          <span style="font-size:var(--f3)">${k+1}. ${esc(s.ten)}</span></div>
          <div class="bar"><i style="width:${((s.d[n-1]-mn)/(mx-mn)*100).toFixed(0)}%;background:${CO[s.i%7]}"></i></div>
        </div>
        <div style="text-align:right"><div style="font-size:var(--f4);font-weight:800"
          class="${s.d[n-1]>100?'up':'dn'}">${s.d[n-1]>100?'+':''}${(s.d[n-1]-100).toFixed(0)}%</div>
          <div style="font-size:var(--f1);color:var(--mut2);font-weight:700">3 NĂM</div></div>
      </div></div>`).join('')}`;
}

      <div class="lab">Mỗi tháng bỏ vào</div>
      <div class="big">5.000.000 <span style="font-size:var(--f3);color:var(--mut2)">đ</span></div>
      <div style="display:flex;gap:14px;margin-top:10px;padding-top:10px;
        border-top:1px solid var(--line)">
        <div><div class="lab">Rổ này 1 năm</div>
          <div style="font-size:var(--f5);font-weight:800" class="${cls(tb)}">${tb==null?'—':pc(tb)}</div></div>
        <div><div class="lab">Mỗi mã</div>
          <div style="font-size:var(--f5);font-weight:800">${nf(Math.round(5000000*w/100))} đ</div></div>
        <div><div class="lab">Cả năm</div>
          <div style="font-size:var(--f5);font-weight:800">60 tr</div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:11px">
        ${['1 triệu','3 triệu','5 triệu','10 triệu'].map((t,i)=>
          `<button class="ico ${i===2?'on':''}" style="flex:1;justify-content:center">${t}</button>`).join('')}
      </div></div></div>
    <div class="chips">${sec.map((s,i)=>`<button class="${i===0?'on':''}">${esc(s.split(' ')[0])}</button>`).join('')}</div>
    <div class="thead"><span>Rổ ${esc(sec[0])} · ${pick.length} mã</span><b>Tỷ trọng</b><b>1 năm</b></div>
    ${pick.map(c=>`<button class="row" data-sym="${c.s}">
      <span class="co">${logo(c.s)}<span class="id"><span class="s">${c.s}</span>
        <span class="n">${esc(c.n)}</span></span></span>
      <span class="px"><span class="p">${w.toFixed(1)}%</span>
        <span class="g">${nf(5000000*w/100)} đ</span></span>
      <span class="pc ${cls(c.r250)}">${c.r250==null?'—':pc(c.r250)}</span></button>`).join('')}
    <div class="hint">Rổ tính trên toàn ngành, kể cả mã dưới 1.000 tỷ — chỉ đường vẽ trên biểu đồ
      mới lọc bớt cho đỡ rối.</div>`;
}

/* ========================= MÀN 5 · TẬP ĐOÀN =============================== */
function mTd(){
  return `<div class="h2">Danh mục tập đoàn<span>${nf(D.nTd)} nhóm · gom theo cổ đông mẹ và chuỗi sở hữu</span></div>
    ${D.td.map(g=>{
      const mo=S.tdOpen===g.id;
      const kie=g.kieu==='nn'?'<span class="tag nn">Nhà nước</span>'
               :g.kieu==='cn'?'<span class="tag cn">Cá nhân</span>':'';
      const dau=g.me?logo(g.me):`<span class="lgi">${esc((g.ten||'').replace(/[^\p{L}\p{N}]/gu,'').slice(0,2).toUpperCase())}</span>`;
      return `<div class="tdg">
        <button class="tdh" data-td="${g.id}">
          <div style="display:flex;gap:9px;align-items:center;min-width:0">
            ${dau}
            <div style="min-width:0">
              <div class="nm">${esc(g.ten)}</div>
              <div class="mt">${kie}<span class="tag">${g.n} mã</span>
                <span class="tag">${tyD(g.mcap)}</span></div>
            </div></div>
          <div style="font-size:17px;color:var(--mut2)">${mo?'▾':'▸'}</div>
        </button>
        ${mo?`<div class="tdb">
          <div class="tdr" style="font-size:var(--f1);font-weight:800;color:var(--mut2);
            letter-spacing:.05em;text-transform:uppercase">
            <span>Công ty con</span><span class="n1">Vốn hoá</span><span class="n2">1D</span></div>
          ${g.syms.map(x=>`<div class="tdr">
            <span style="display:flex;gap:8px;align-items:center;min-width:0">
              <span class="s">${x.s}</span>
              <span class="own">${x.p==null?'mẹ':(x.gt?'gián tiếp ':'')+x.p+'%'}</span></span>
            <span class="n1">${ty(x.mc)}</span>
            <span class="n2 ${cls(x.chg)}">${pc(x.chg)}</span></div>`).join('')}
        </div>`:''}
      </div>`;}).join('')}
    <div class="hint">Nhãn <b>Nhà nước</b> / <b>Cá nhân</b> nằm trên dòng riêng chứ không nhét
      chung hàng với tên — trên màn hẹp nhét chung là bị cắt mất.</div>`;
}
function mQuy(){
  return `<div class="h2">Quỹ đầu tư<span>${D.quy.length} quỹ quy mô từ 500 tỷ trở lên</span></div>
    <div class="thead"><span>Quỹ · nắm nhiều nhất</span><b>Quy mô</b><b>Số mã</b></div>
    ${D.quy.map(q=>`<div class="row">
      <span class="co"><span class="lgi">${esc(q.ma.slice(0,2))}</span><span class="id">
        <span class="s">${esc(q.ma)} ${q.cu?'<span class="tag cn">số cũ</span>':''}</span>
        <span class="n" style="max-width:168px">${q.syms.map(x=>x.s).join(' · ')}</span></span></span>
      <span class="px"><span class="p">${ty(q.tong)} tỷ</span>
        <span class="g">kỳ ${esc(q.ky||'—')}</span></span>
      <span class="pc">${q.n}</span></div>`).join('')}
    <div class="hint"><b>Kỳ công bố lệch nhau hơn hai năm</b> — quỹ nội báo cáo tới giữa 2026,
      Dragon Capital và PYN thì nguồn chỉ tới 2024. Gộp chung rồi gọi “đang nắm giữ” là dựng
      nên một danh mục không còn tồn tại, nên quỹ có số cũ bị dán nhãn và đẩy xuống dưới.</div>`;
}

/* ========================= MÀN 6 · TRANG CỔ PHIẾU ========================= */
function mCp(){
  const K=D.cp[S.sym]||D.cp.FPT, c=K.row;
  const px=K.px, mn=Math.min(...px), mx=Math.max(...px);
  const W=352,H=150;
  const pts=px.map((v,i)=>`${(i/(px.length-1)*W).toFixed(1)},${(H-(v-mn)/(mx-mn)*(H-10)-5).toFixed(1)}`).join(' ');
  const co=c.chg>=0?'var(--up)':'var(--dn)';
  const Y=K.Y, mxr=Math.max(...Y.map(y=>Math.abs(y.np)));
  const g=(k,v,t)=>`<div><div class="k">${k}</div><div class="v ${t||''}">${v}</div></div>`;
  return `<div class="cph">
      <div class="r1">${logo(c.s)}
        <div style="flex:1;min-width:0"><div class="s">${c.s} <span class="tag">${c.ex}</span></div>
          <div class="nm">${esc(c.n)} · ${esc(c.sec)}</div></div></div>
      <div class="pxb"><span class="p ${cls(c.chg)}">${nf(c.c)}</span>
        <span class="c ${cls(c.chg)}">${pc(c.chg)} · ${c.chg>=0?'+':''}${nf(c.c-c.ref)}</span></div>
    </div>
    <div class="mini">${['1T','1Th','3Th','6Th','1N','5N','Tất cả'].map((t,i)=>
      `<button class="${i===4?'on':''}">${t}</button>`).join('')}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;padding:0 0 6px">
      <defs><linearGradient id="fg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${co}" stop-opacity=".28"/>
        <stop offset="100%" stop-color="${co}" stop-opacity="0"/></linearGradient></defs>
      <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#fg1)"/>
      <polyline points="${pts}" fill="none" stroke="${co}" stroke-width="1.8" stroke-linejoin="round"/>
    </svg>
    <div class="card"><div class="g2">
      ${g('Vốn hoá',tyD(c.mc))}
      ${g('KLGD',nf(Math.round(c.vol/1000))+'K')}
      ${g('P/E',K.pe??'—')}
      ${g('P/B',K.pb??'—')}
      ${g('EPS',nf(K.eps)+' đ')}
      ${g('RSI',c.rsi==null?'—':c.rsi.toFixed(0),c.rsi>70?'dn':c.rsi<30?'up':'')}
      ${g('Cao nhất phiên',nf(c.hi))}
      ${g('Thấp nhất phiên',nf(c.lo))}
      ${g('Trần',nf(c.ceil),'')}
      ${g('Sàn',nf(c.fl),'')}
      ${g('NN mua',nf(c.fb,1)+' tỷ','up')}
      ${g('NN bán',nf(c.fs,1)+' tỷ','dn')}
    </div></div>
    <div class="card"><div class="h"><span class="t">Lợi nhuận sau thuế</span>
      <span class="s">tỷ đồng</span></div>
      <div class="fin">${Y.map(y=>`<div class="finr">
        <span class="y">${y.l}</span>
        <span class="bar" style="margin:0"><i style="width:${(Math.abs(y.np)/mxr*100).toFixed(0)}%;
          background:${y.np<0?'var(--dn)':'var(--up)'}"></i></span>
        <span class="v ${y.np<0?'dn':''}">${nf(y.np)}</span></div>`).join('')}</div></div>
    <div class="card"><div class="h"><span class="t">Cổ tức đã trả</span></div>
      <div class="fin">${K.div.map(d=>`<div class="finr" style="grid-template-columns:52px 1fr auto">
        <span class="y">${d.y}</span>
        <span style="color:var(--mut2);font-size:var(--f2)">${
          [d.cash?'tiền '+nf(d.cash)+' đ':'',d.cp?'cổ phiếu '+d.cp+'%':'',d.th?'thưởng '+d.th+'%':'']
          .filter(Boolean).join(' · ')||'không chia'}</span>
        <span class="v">${d.cash?nf(d.cash)+' đ':'—'}</span></div>`).join('')}</div></div>
    <div class="hint">Đây là ba mã có sẵn số thật trong bản demo (FPT · TCB · HPG).
      Bấm mã khác sẽ rơi về FPT.</div>`;
}

/* ========================= TẤM TRƯỢT ====================================== */
const KTEN={tien:'Tiền mặt',cp:'Cổ phiếu',thuong:'Thưởng',quyen:'Quyền mua'};
function sheetLoc(){
  return {t:'Bộ lọc',b:`
    <div style="padding:13px 15px 0" class="lab">Sàn &amp; rổ</div>
    <div class="chips">${LOC.map(([k,t])=>
      `<button data-loc="${k}" class="${S.loc===k?'on':''}">${t}</button>`).join('')}</div>
    <div style="padding:6px 15px 0" class="lab">Sắp theo</div>
    <div class="chips">${SORT.map(([k,t])=>
      `<button data-so="${k}" class="${S.sort===k?'on':''}">${t}${S.sort===k?(S.dir<0?' ↓':' ↑'):''}</button>`).join('')}</div>
    <div style="padding:6px 15px 0" class="lab">Ngành</div>
    <div class="chips">${D.secs.slice(0,12).map(s=>
      `<button>${esc(s.length>18?s.slice(0,17)+'…':s)}</button>`).join('')}</div>
    <div style="padding:11px 15px 18px;display:flex;gap:9px">
      <button class="ico" style="flex:1;justify-content:center;height:44px" data-reset>Xoá lọc</button>
      <button class="ico on" style="flex:2;justify-content:center;height:44px" data-close>Xem kết quả</button>
    </div>`};
}
function sheetCt(){
  const F=[['all','Tất cả'],['tien','Tiền mặt'],['cp','Cổ phiếu'],['thuong','Thưởng']];
  const list=D.ct.filter(x=>S.ctLoc==='all'||x.k===S.ctLoc);
  let cur='',out='';
  list.forEach(x=>{
    if(x.d!==cur){cur=x.d;out+=`<div class="dday">${new Date(x.d).toLocaleDateString('vi-VN',
      {weekday:'long',day:'2-digit',month:'2-digit'})}</div>`;}
    out+=`<div class="ctr">
      <span style="display:flex;gap:9px;align-items:center">${logo(x.s)}
        <span><b style="font-size:var(--f4);font-weight:800">${x.s}</b>
          <div class="d">ngày giao dịch không hưởng quyền</div></span></span>
      <span class="r"><div class="v">${x.k==='tien'?nf(x.tien)+' đ':x.tl+'%'}</div>
        <div class="k">${KTEN[x.k]||x.k}</div></span></div>`;
  });
  return {t:'Lịch chia cổ tức',b:`
    <div class="chips">${F.map(([k,t])=>
      `<button data-ct="${k}" class="${S.ctLoc===k?'on':''}">${t}</button>`).join('')}</div>
    ${out||'<div class="hint">Không có sự kiện nào.</div>'}
    <div class="hint" style="padding-bottom:18px">Bản thật đang theo dõi ${nf(D.nCt)} sự kiện
      từ ${D.ct[0]?.d} trở đi.</div>`};
}
function openSheet(k){
  const o=k==='loc'?sheetLoc():sheetCt();
  $('#sheet .sh').innerHTML=`<span class="t">${o.t}</span><button class="x" data-close>✕</button>`;
  $('#sheet .sb').innerHTML=o.b;
  $('#sheet').classList.add('on'); $('#mask').classList.add('on');
  $('#sheet').dataset.k=k;
}
const closeSheet=()=>{$('#sheet').classList.remove('on');$('#mask').classList.remove('on');};

/* ========================= VẼ ============================================= */
function draw(){
  drawTop(); drawTabs();
  const B=$('#body');
  B.innerHTML = S.m==='cp'  ? mCp()
    : S.m==='bang' ? mBang()
    : S.m==='bong' ? mBong()
    : S.m==='tap'  ? (S.t==='quy'?mQuy():mTd())
    : S.m==='radar'? (S.t==='cd'?mCd():S.t==='vb'?mVb():mPhien())
    : S.m==='dua'  ? (S.t==='dca'?mDca():mDua())
    : '';
  B.scrollTop=0;
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]');
  if(tab){const k=tab.dataset.tab;S.m=k;S.t=(SUB[k]||[['','']])[0][0]||'';draw();return;}
  const sub=t.closest('[data-sub]'); if(sub){S.t=sub.dataset.sub;draw();return;}
  const so=t.closest('[data-sort]'); if(so){
    const k=so.dataset.sort; if(S.sort===k)S.dir*=-1; else{S.sort=k;S.dir=-1;} draw(); return;}
  const sy=t.closest('[data-sym]'); if(sy){S.sym=sy.dataset.sym;S.m='cp';draw();return;}
  const td=t.closest('[data-td]'); if(td){S.tdOpen=S.tdOpen===td.dataset.td?null:td.dataset.td;draw();return;}
  const sh=t.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return;}
  if(t.closest('[data-back]')){S.m='bang';S.t='';draw();return;}
  if(t.closest('[data-close]')||t.id==='mask'){closeSheet();return;}
  const lo=t.closest('[data-loc]'); if(lo){S.loc=lo.dataset.loc;openSheet('loc');draw();return;}
  const s2=t.closest('[data-so]');  if(s2){
    const k=s2.dataset.so; if(S.sort===k)S.dir*=-1; else{S.sort=k;S.dir=-1;} openSheet('loc');draw();return;}
  const ct=t.closest('[data-ct]');  if(ct){S.ctLoc=ct.dataset.ct;openSheet('ct');return;}
  if(t.closest('[data-reset]')){S.loc='all';S.sort='gt';S.dir=-1;openSheet('loc');draw();return;}
});
$('#lamp').onclick=()=>{
  const p=$('#ph'), d=p.classList.toggle('dark'); p.classList.toggle('light',!d);
  $('#lamp').textContent=d?'🌙':'☀️';
};

fetch('assets/demo-mobi.json?v=3').then(r=>r.json()).then(j=>{D=j;draw();})
  .catch(()=>{$('#body').innerHTML='<div class="hint">Không nạp được assets/demo-mobi.json — '
    +'trang này phải mở qua web chứ không mở thẳng từ file.</div>';});
</script>
</body>
</html>
