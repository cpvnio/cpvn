<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>CPVN — Demo mobile A · Bảng điện</title>
<link rel="icon" type="image/png" href="assets/logo-64.png?v=3"/>
<style>
/* ============================================================================
   DEMO MOBILE — MẪU A "BẢNG ĐIỆN"
   Đậm đặc, nền tối, dành cho người mở app ngày mấy chục lần và quét nhiều mã.

   BA QUYẾT ĐỊNH GỐC, đều rút từ thói quen số đông chứ không phải sở thích:
   1. ĐIỀU HƯỚNG XUỐNG ĐÁY. Cầm một tay thì ngón cái với thoải mái vùng dưới,
      còn hai góc trên là chỗ khó với nhất. Menu đang nằm trên đỉnh + xổ ra khi
      RÊ CHUỘT — mà trên điện thoại không hề có thao tác rê.
   2. BA CỘT, KHÔNG HƠN. Màn hẹp thì mắt bám mép trái (biết đang xem mã nào) và
      mép phải (con số quyết định). Khúc giữa là vùng chết. Nhồi 6 cột như bản
      desktop thì cột nào cũng phải bóp, đọc số nào cũng phải căng mắt.
   3. SỐ PHẢI SO ĐƯỢC. Cùng bề rộng chữ số (tabular-nums), cùng số lẻ, cùng mép
      phải — mắt so hàng dọc trong một nhịp, không phải đọc từng số một.
   ========================================================================== */

/* ---------------- THANG CHỮ: 6 bậc, phân biệt bằng ĐỘ ĐẬM là chính ---------
   Dữ liệu dày mà tăng cỡ chữ để nhấn thì vỡ bố cục. Nên chênh lệch chủ yếu do
   độ đậm và màu; cỡ chỉ nhảy khi thật sự đổi vai trò. */
:root{
  --f1:11px;   /* nhãn cột, chữ hoa, giãn chữ */
  --f2:12.5px; /* phụ chú: sàn, ngành, ngày */
  --f3:14px;   /* số phụ: %, GTGD */
  --f4:15.5px; /* mã + giá — bậc chính của hàng */
  --f5:17px;   /* số nổi trong thẻ */
  --f6:22px;   /* tiêu đề màn */
  --f7:30px;   /* giá lớn trang cổ phiếu */
  --w-norm:450; --w-med:600; --w-bold:700; --w-black:800;

  /* THANG CÁCH 4px. Mọi padding/gap/margin đều là bội của 4 — mắt không đọc ra
     con số, nhưng đọc ra được sự KHÔNG đều: 9px cạnh 11px cạnh 13px thì từng chỗ
     đều "gần đúng" mà cả trang thì lệch nhịp. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  /* THANG BO GÓC 4 bậc, gắn với cỡ vật: chip nhỏ 8 · ô 12 · thẻ 16 · tấm trượt 20 */
  --r1:8px; --r2:12px; --r3:16px; --r4:20px;
  --tap:44px;  /* cạnh nhỏ nhất của mọi thứ bấm được */
  --ms:120ms;  /* mọi phản hồi khi nhấn dùng chung một nhịp */
}

/* ---------------- MÀU ------------------------------------------------------
   Xanh dương là màu được nhiều người chọn là "màu tôi thích nhất" hơn bất kỳ
   màu nào khác, gần như ở mọi nước và cả hai giới — nên lấy làm màu thương hiệu
   / màu đang-chọn. Nhưng MÀU GIÁ thì không được đụng: xanh lá tăng, đỏ giảm,
   tím trần, xanh lơ sàn, vàng tham chiếu — dân sàn VN đọc theo phản xạ. */
/* HAI SẮC ĐỘ ĐƯỜNG KẺ, đừng dùng chung một màu cho tất cả: `--line` là đường có
   NHIỆM VỤ CHIA KHỐI (đáy header, viền thẻ), `--rule` là vạch giữa các hàng trong
   cùng một khối — phải nhạt hơn hẳn, bằng không bảng 60 hàng trông như lưới kẻ ô.
   `--mut2` đã nâng cho đạt tương phản 4.5:1 (bản cũ 4.37 ở nền tối, 3.28 ở nền
   sáng — chữ phụ mờ đúng kiểu "nhìn thì thấy, đọc thì mỏi"). */
.dark{
  --bg:#1b2130; --bg2:#161b28; --pan:#232b3d; --pan2:#2b3448;
  --line:#39435c; --rule:rgba(255,255,255,.07);
  --txt:#e9edf6; --mut:#98a4bc; --mut2:#838fa6;
  --acc:#5b93ff; --acc-bg:rgba(91,147,255,.15); --acc-line:rgba(91,147,255,.45);
  --up:#22c98a; --dn:#f0505c; --ref:#eab308; --cei:#c084fc; --flo:#22d3ee;
  --up-bg:rgba(34,201,138,.13); --dn-bg:rgba(240,80,92,.13);
  --lgbg:#eef1f6; --lgring:rgba(255,255,255,.10);
  --sh:0 6px 20px rgba(0,0,0,.35);
  --fade:linear-gradient(90deg,rgba(27,33,48,0),rgba(27,33,48,.96));
  --skel:rgba(255,255,255,.055);
}
.light{
  --bg:#f1f4f9; --bg2:#e7ecf4; --pan:#ffffff; --pan2:#f4f7fb;
  --line:#dbe2ed; --rule:rgba(19,26,38,.075);
  --txt:#131a26; --mut:#5c6880; --mut2:#626d7e;
  --acc:#2563eb; --acc-bg:rgba(37,99,235,.1); --acc-line:rgba(37,99,235,.4);
  --up:#0f9d58; --dn:#d92c3c; --ref:#c98a00; --cei:#9333ea; --flo:#0891b2;
  --up-bg:rgba(15,157,88,.09); --dn-bg:rgba(217,44,60,.09);
  --lgbg:#ffffff; --lgring:rgba(19,26,38,.09);
  --sh:0 6px 20px rgba(15,23,42,.09);
  --fade:linear-gradient(90deg,rgba(241,244,249,0),rgba(241,244,249,.96));
  --skel:rgba(19,26,38,.06);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0b0e14;color:#e9edf6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* ---- khung máy: chỉ hiện trên máy bàn, còn trên điện thoại thì phủ kín ---- */
.tray{min-height:100%}
.tray>.note{display:none}
.phone{width:100%;height:100dvh;overflow:hidden;position:relative;background:var(--bg);color:var(--txt)}
@media(min-width:820px){
  body{background:radial-gradient(1200px 700px at 50% -10%,#1e2740,#0b0e14)}
  .tray{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:26px 0 40px}
  .tray>.note{display:block;text-align:center;max-width:640px;color:#93a2bd;font-size:13.5px;line-height:1.65}
  .tray>.note b{color:#e9edf6}
  .phone{width:390px;height:820px;border-radius:46px;border:11px solid #0e1118;
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 2px #262d3d}
}

/* ---- vỏ ứng dụng ---- */
.app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-bottom:16px}

/* ---- ĐẦU TRANG: mảnh hết mức. Chỉ giữ thứ luôn cần: chỉ số + hai nút ---- */
.top{background:var(--pan);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:20}
.tbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);height:52px}
.brand{font-size:15px;font-weight:var(--w-black);letter-spacing:.2px}
.brand em{font-style:normal;color:var(--acc)}
.tbar .sp{flex:1}
.ico{height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r1);background:var(--pan2);border:1px solid var(--line);font-size:12.5px;
  font-weight:var(--w-bold);gap:var(--s1);padding:0 10px;
  transition:background var(--ms),border-color var(--ms),transform var(--ms)}
.ico:active{transform:scale(.96)}
.ico.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc)}
.ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* Dải chỉ số cuộn ngang. Mép phải LUÔN có dải mờ để nói "còn nữa" — bản cũ cắt
   phẳng giữa chữ, trông như lỗi tràn chứ không như một dải cuộn được. */
.scrx{position:relative}
.scrx::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:26px;
  background:var(--fade);pointer-events:none}
.idxrow{display:flex;gap:var(--s2);padding:var(--s2) var(--s3);overflow-x:auto;scrollbar-width:none;
  box-shadow:0 1px 0 var(--line);background:var(--bg2)}
.idxrow::-webkit-scrollbar{display:none}
.chipx{flex:0 0 auto;background:var(--pan);border:1px solid var(--line);border-radius:var(--r2);
  padding:var(--s2) 10px;min-width:112px}
.chipx .k{font-size:var(--f1);font-weight:var(--w-black);color:var(--mut2);letter-spacing:.06em}
.chipx .v{font-size:var(--f4);font-weight:var(--w-black);margin-top:2px;line-height:1.15}
.chipx .c{font-size:var(--f2);font-weight:var(--w-bold);margin-top:1px}
.chipx .g{font-size:var(--f1);font-weight:var(--w-med);color:var(--mut2);margin-top:2px}

/* ---- THANH TAB ĐÁY: 5 mục, đúng vùng ngón cái với tới ---- */
.tabbar{display:flex;background:var(--pan);box-shadow:0 -1px 0 var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:30}
.tabbar button{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s1);color:var(--mut2);font-size:10.5px;font-weight:var(--w-bold);
  position:relative;padding-top:3px;transition:color var(--ms)}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--acc)}
.tabbar button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;
  background:var(--acc);border-radius:0 0 2px 2px}

/* ---- thanh mục con: chỉ hiện ở tab nào thật sự có mục con ---- */
.subs{display:flex;gap:var(--s2);padding:10px var(--s3);overflow-x:auto;scrollbar-width:none;
  box-shadow:0 1px 0 var(--line);background:var(--bg)}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:0 0 auto;height:34px;padding:0 var(--s3);border-radius:var(--r1);background:var(--pan);
  border:1px solid var(--line);font-size:var(--f3);font-weight:var(--w-bold);color:var(--mut);
  display:flex;align-items:center;gap:6px;transition:background var(--ms),color var(--ms),
  border-color var(--ms),transform var(--ms)}
.subs button:active{transform:scale(.97)}
.subs button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.subs button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- ĐẦU BẢNG + HÀNG MÃ: xương sống của mẫu này -------------------------
   ĐƠN VỊ NẰM Ở ĐẦU CỘT, KHÔNG LẶP TRONG TỪNG Ô. Bản cũ ghi "1.1N tỷ" cạnh
   "938 tỷ" — vừa lặp chữ "tỷ" 60 lần một màn, vừa đổi bậc giữa chừng nên hai số
   cùng cột không so thẳng được bằng mắt. Nay đầu cột ghi "GIÁ · GTGD (TỶ)" và ô
   chỉ còn con số thuần. */
.thead{display:grid;grid-template-columns:1fr 96px 72px;gap:var(--s2);padding:var(--s2) var(--s3);
  background:var(--bg2);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:10;
  font-size:var(--f1);font-weight:var(--w-black);letter-spacing:.04em;color:var(--mut2);
  text-transform:uppercase;white-space:nowrap}
.thead b{font-weight:var(--w-black);text-align:right;display:flex;align-items:center;
  justify-content:flex-end;gap:3px;transition:color var(--ms)}
.thead b.act{color:var(--acc)}
.thead b svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.row{display:grid;grid-template-columns:1fr 96px 72px;gap:var(--s2);align-items:center;
  padding:0 var(--s3);min-height:56px;box-shadow:inset 0 -1px 0 var(--rule);width:100%;text-align:left;
  transition:background var(--ms)}
.row:active{background:var(--pan2)}
.co{display:flex;align-items:center;gap:10px;min-width:0}
.co .s,.co .n,.px .p,.px .g{display:block}
/* Ô logo: cùng một khung cho ảnh và cho chữ tắt, thêm vòng viền mảnh. Không có
   vòng này thì logo nền trắng nổi thành đốm sáng trên nền tối, cả cột trái lấm tấm. */
.lg,.lgi{width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px var(--lgring)}
.lg{object-fit:contain;background:var(--lgbg);padding:2px}
.lgi{display:flex;align-items:center;justify-content:center;background:var(--pan2);
  color:var(--mut);font-size:10px;font-weight:var(--w-black);letter-spacing:-.2px}
.co .id{min-width:0}
.co .s{font-size:var(--f4);font-weight:var(--w-black);letter-spacing:.2px;line-height:1.2}
.co .n{font-size:var(--f2);color:var(--mut2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:150px;line-height:1.25;margin-top:2px}
.px{text-align:right}
.px .p{font-size:var(--f4);font-weight:var(--w-bold);line-height:1.2;white-space:nowrap}
.px .g{font-size:var(--f2);color:var(--mut2);margin-top:2px;white-space:nowrap}
/* Chip % ôm sát con số chứ không kéo hết bề ngang cột — kéo hết thì nó thành
   một mảng màu, mà cả bảng toàn mảng màu thì không còn chỗ nào là điểm nhấn. */
.pc{text-align:right;font-size:var(--f3);font-weight:var(--w-black)}
.pc i{font-style:normal;display:inline-block;border-radius:6px;padding:4px 6px;
  min-width:64px;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--ref)}
.pc.up i{background:var(--up-bg)}.pc.dn i{background:var(--dn-bg)}
.pc.fl i{background:rgba(234,179,8,.13)}

/* ---- thẻ dùng chung ---- */
.card{background:var(--pan);border:1px solid var(--line);border-radius:var(--r3);
  margin:var(--s3);overflow:hidden}
.card>.h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s3) 0}
.card>.h .t{font-size:var(--f4);font-weight:var(--w-black)}
.card>.h .s{font-size:var(--f2);color:var(--mut2);margin-left:auto}
.card>.b{padding:var(--s3)}
.lab{font-size:var(--f1);font-weight:var(--w-black);letter-spacing:.06em;color:var(--mut2);
  text-transform:uppercase}
.big{font-size:var(--f6);font-weight:var(--w-black);line-height:1.15}
/* Ghi chú của bản demo — là lời tao nói với mày, không phải chữ của sản phẩm.
   Nên tách hẳn ra bằng một vạch dọc thay vì trộn vào nội dung như trước. */
.hint{margin:var(--s3) var(--s3) var(--s1);padding:2px 0 2px var(--s3);
  border-left:2px solid var(--line);font-size:var(--f2);color:var(--mut2);line-height:1.6}
.hint b{color:var(--mut)}
.h2{padding:var(--s4) var(--s3) var(--s2);font-size:var(--f6);font-weight:var(--w-black);
  letter-spacing:-.3px}
.h2 span{display:block;font-size:var(--f2);font-weight:var(--w-med);color:var(--mut2);
  letter-spacing:0;margin-top:var(--s1)}

/* ---- lưới chỉ số 2 cột ---- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.g2>div{background:var(--pan);padding:10px var(--s3)}
.g2 .k{font-size:var(--f1);font-weight:var(--w-black);color:var(--mut2);letter-spacing:.05em;
  text-transform:uppercase}
.g2 .v{font-size:var(--f5);font-weight:var(--w-black);margin-top:var(--s1);white-space:nowrap}

/* ---- tấm trượt lên từ đáy (bộ lọc, lịch cổ tức) ------------------------- */
.mask{position:absolute;inset:0;background:rgba(5,8,14,.62);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .18s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--pan);
  border-radius:var(--r4) var(--r4) 0 0;box-shadow:0 -1px 0 var(--line);max-height:82%;
  display:flex;flex-direction:column;transform:translateY(102%);
  transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:var(--s2) auto 0}
.sheet .sh{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s4) var(--s3);
  box-shadow:0 1px 0 var(--line)}
.sheet .sh .t{font-size:var(--f5);font-weight:var(--w-black)}
.sheet .sh .x{margin-left:auto;width:32px;height:32px;border-radius:var(--r1);background:var(--pan2);
  display:flex;align-items:center;justify-content:center;color:var(--mut)}
.sheet .sh .x svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round}
.sheet .sb{overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}

/* ---- chip lọc ---- */
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s3) var(--s4)}
.chips button{height:34px;padding:0 var(--s3);border-radius:var(--r1);background:var(--pan2);
  border:1px solid var(--line);font-size:var(--f3);font-weight:var(--w-bold);color:var(--mut);
  transition:background var(--ms),color var(--ms),border-color var(--ms),transform var(--ms)}
.chips button:active{transform:scale(.97)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- hàng cổ tức ---- */
.ctr{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;
  padding:10px var(--s4);box-shadow:inset 0 -1px 0 var(--rule)}
.ctr .d{font-size:var(--f2);color:var(--mut2);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:196px}
.ctr .r{text-align:right}
.ctr .r .v{font-size:var(--f4);font-weight:var(--w-black)}
.ctr .r .k{font-size:var(--f1);font-weight:var(--w-bold);color:var(--mut2);text-transform:uppercase;
  letter-spacing:.05em;margin-top:2px}
.dday{padding:var(--s2) var(--s4);background:var(--bg2);font-size:var(--f2);font-weight:var(--w-black);
  color:var(--mut);position:sticky;top:0;box-shadow:inset 0 -1px 0 var(--line);
  display:flex;align-items:baseline;gap:var(--s2)}
.dday em{font-style:normal;font-weight:var(--w-med);color:var(--mut2);font-size:var(--f1);
  letter-spacing:.04em;text-transform:uppercase;margin-left:auto}

/* ---- tập đoàn ---- */
.tdg{box-shadow:inset 0 -1px 0 var(--rule)}
.tdh{display:grid;grid-template-columns:1fr auto;gap:var(--s3);align-items:center;
  padding:var(--s3);width:100%;text-align:left;transition:background var(--ms)}
.tdh:active{background:var(--pan2)}
.tdh .nm{font-size:var(--f4);font-weight:var(--w-black);line-height:1.25}
.tdh .mt{font-size:var(--f2);color:var(--mut2);margin-top:6px;display:flex;gap:var(--s1);flex-wrap:wrap}
.tdh .cv{color:var(--mut2);transition:transform var(--ms)}
.tdh .cv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.tdh.mo .cv{transform:rotate(90deg)}
.tag{font-size:10px;font-weight:var(--w-black);padding:3px 6px;border-radius:5px;letter-spacing:.03em;
  background:var(--pan2);color:var(--mut);white-space:nowrap;line-height:1.25}
.tag.nn{background:rgba(91,147,255,.16);color:var(--acc)}
.tag.cn{background:rgba(234,179,8,.16);color:var(--ref)}
.tdb{background:var(--bg2);box-shadow:inset 0 1px 0 var(--line)}
.tdr{display:grid;grid-template-columns:1fr 92px 62px;gap:var(--s2);align-items:center;
  padding:10px var(--s3) 10px 28px;box-shadow:inset 0 -1px 0 var(--rule);position:relative;
  font-size:var(--f3)}
.tdr::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:1px;background:var(--line)}
.tdr:last-child{box-shadow:none}
.tdr .s{font-weight:var(--w-black);font-size:var(--f4)}
.tdr .own{font-size:var(--f2);color:var(--mut2);margin-top:1px}
.tdr .n1,.tdr .n2{text-align:right;font-weight:var(--w-bold)}

/* ---- Venn chủ điểm ---- */
.venn{display:block;margin:0 auto;max-width:100%}
.src{margin:0 var(--s3) var(--s3);padding:10px var(--s3);border-radius:var(--r2);
  background:var(--acc-bg);border:1px solid var(--acc-line);font-size:var(--f2);color:var(--txt);
  line-height:1.6;display:flex;gap:var(--s2)}
.src svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.8;flex:0 0 auto;
  margin-top:2px;stroke-linecap:round;stroke-linejoin:round}
.src b{color:var(--acc)}

/* ---- thanh ngang so sánh ---- */
.bar{height:6px;border-radius:3px;background:var(--pan2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}

/* ---- trang cổ phiếu ---- */
.cph{padding:var(--s3);background:var(--pan);box-shadow:0 1px 0 var(--line)}
.cph .r1{display:flex;align-items:center;gap:var(--s3)}
.cph .r1 .lg,.cph .r1 .lgi{width:40px;height:40px;border-radius:var(--r2);font-size:12px}
.cph .nm{font-size:var(--f2);color:var(--mut2);margin-top:3px}
.cph .s{font-size:var(--f5);font-weight:var(--w-black);letter-spacing:.3px;
  display:flex;align-items:center;gap:var(--s2)}
.cph .pxb{display:flex;align-items:flex-end;gap:var(--s2);margin-top:var(--s3)}
.cph .pxb .p{font-size:var(--f7);font-weight:var(--w-black);letter-spacing:-.8px;line-height:1}
.cph .pxb .c{font-size:var(--f4);font-weight:var(--w-black);padding-bottom:3px}
.mini{display:flex;gap:var(--s1);padding:10px var(--s3);overflow-x:auto;scrollbar-width:none}
.mini::-webkit-scrollbar{display:none}
.mini button{flex:0 0 auto;height:30px;padding:0 var(--s3);border-radius:var(--r1);
  background:transparent;border:1px solid transparent;font-size:var(--f2);
  font-weight:var(--w-bold);color:var(--mut2);transition:background var(--ms),color var(--ms)}
.mini button.on{background:var(--acc-bg);border-color:var(--acc-line);color:var(--acc)}
.fin{padding:var(--s1) var(--s3) var(--s3)}
.finr{display:grid;grid-template-columns:52px 1fr 78px;gap:var(--s3);align-items:center;
  padding:var(--s2) 0;font-size:var(--f3)}
.finr .y{color:var(--mut2);font-weight:var(--w-bold)}
.finr .v{text-align:right;font-weight:var(--w-black)}

/* ---- KHUNG XƯƠNG lúc đang tải -------------------------------------------
   Chớp một màn trắng rồi đổ chữ vào là cảm giác trang giật. Vẽ sẵn đúng hình
   dáng của bảng sắp hiện thì mắt đã bám vào bố cục trước khi số về. */
@keyframes tho{0%,100%{opacity:.55}50%{opacity:1}}
.sk{animation:tho 1.4s ease-in-out infinite}
.sk i{display:block;background:var(--skel);border-radius:5px;height:11px}
.skrow{display:grid;grid-template-columns:1fr 96px 72px;gap:var(--s2);align-items:center;
  padding:0 var(--s3);min-height:56px;box-shadow:inset 0 -1px 0 var(--rule)}
.skrow .c1{display:flex;align-items:center;gap:10px}
.skrow .c1 u{width:30px;height:30px;border-radius:9px;background:var(--skel);flex:0 0 auto}

/* ---- nút đổi mẫu / đổi đèn, nổi trên cùng ---- */
/* Nút đổi mẫu A/B + đổi đèn — chỉ là đồ nghề của bản demo, không thuộc thiết kế.
   Dán xuống góc trái dưới để không đè lên hai nút thật ở đầu trang. */
.ab{position:absolute;left:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:90;display:flex;gap:6px}
.ab a,.ab button{height:28px;padding:0 10px;border-radius:8px;background:rgba(10,14,24,.84);
  color:#e9edf6;border:1px solid rgba(255,255,255,.18);font-size:11.5px;font-weight:var(--w-black);
  display:flex;align-items:center;text-decoration:none;backdrop-filter:blur(8px);
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.ab a.on{background:#5b93ff;border-color:#5b93ff;color:#fff}
</style>
</head>
<body>

<div class="tray">
  <p class="note"><b>Mẫu A · “Bảng điện”</b> — nền tối, đậm đặc, điều hướng dồn xuống đáy cho vừa tầm ngón cái.
  Bấm thử mọi tab, bấm một mã để mở trang cổ phiếu, bấm <b>Lọc</b> và <b>Cổ tức</b> để xem tấm trượt.
  Mở trên điện thoại thì khung máy này biến mất, giao diện phủ kín màn.</p>

  <div class="phone dark" id="ph">
    <div class="ab">
      <a href="demo-mobi-a.html" class="on">A</a>
      <a href="demo-mobi-b.html">B</a>
      <button id="lamp"></button>
    </div>
    <div class="app">
      <div class="top" id="top"></div>
      <div class="body" id="body"></div>
      <nav class="tabbar" id="tabs"></nav>
    </div>
    <div class="mask" id="mask"></div>
    <div class="sheet" id="sheet"><div class="grab"></div><div class="sh"></div><div class="sb"></div></div>
  </div>
</div>

<script>
/* ========================================================================== */
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=x=>x==null?'—':(x>0?'+':'')+x.toFixed(2)+'%';
const cls=x=>x==null?'':x>0.0001?'up':x<-0.0001?'dn':'fl';
/* TRONG CỘT thì đơn vị đã nằm ở đầu cột nên chỉ in số thuần; ngoài cột (thẻ, nhãn,
   câu chữ) mới viết đơn vị ra chữ. Bản cũ tự chế hậu tố "N"/"Tr" rồi rắc khắp nơi —
   không ai ngoài mình hiểu, mà hai số cùng cột lại khác bậc nên không so được. */
const tyD=v=>v==null?'—':Math.abs(v)>=1e6?nf(v/1e6,2)+' triệu tỷ'
  :Math.abs(v)>=1000?nf(v/1000,1)+' nghìn tỷ':nf(v)+' tỷ';
const logo=s=>`<img class="lg" src="assets/logo/${s}.webp" loading="lazy" alt=""
  onerror="this.outerHTML='<span class=lgi>${s.slice(0,3)}</span>'">`;

/* ---- BỘ ICON: một nét, lưới 24, nhận màu từ chữ ---------------------------
   Emoji thì mỗi hệ điều hành vẽ một kiểu, luôn có màu riêng chửi nhau với bảng
   màu, và đứng cạnh chữ thì lệch chân. Trong một sản phẩm tài chính nó là thứ
   lộ ra ngay rằng giao diện được ghép vội. */
const IC={
 bang:'<path d="M3 5h18M3 10h18M3 15h11M3 20h7"/>',
 bong:'<circle cx="8.5" cy="9.5" r="4.5"/><circle cx="17.5" cy="7" r="2.5"/><circle cx="15" cy="16" r="4"/>',
 radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.4-4.2"/>',
 dua:'<path d="M4 20V10M10 20V4M16 20v-8M22 20V7"/>',
 tap:'<path d="M4 21V7.5L11 3l7 4.5V21M4 21h16M9.5 21v-5h4v5M9 11h.01M14 11h.01"/>',
 loc:'<path d="M4 6h16M7 12h10M10 18h4"/>',
 lich:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
 phien:'<path d="M2.5 12.5h4l2.5-6 4 12 2.5-6h6"/>',
 chudiem:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>',
 vebo:'<path d="M4 17.5c1.8 0 1.8 1.4 3.6 1.4s1.8-1.4 3.6-1.4 1.8 1.4 3.6 1.4 1.8-1.4 3.6-1.4"/><path d="M12 14.5V4M12 4l-4 3.6M12 4l4 3.6"/>',
 duadua:'<path d="M5 21V4M5 4.5h11l-2 3.2 2 3.3H5"/>',
 dca:'<path d="M12 20.5c0-5.5 2.2-9 7-9.6-.4 5.4-3 8.4-7 9.6zM12 20.5c0-4.6-2-7.6-6-8.2.3 4.5 2.6 7 6 8.2zM12 20.5V9"/>',
 quy:'<rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 7.5V5.5a2 2 0 012-2h3a2 2 0 012 2v2M3 13h18"/>',
 back:'<path d="M14.5 5.5L8 12l6.5 6.5"/>',
 xoa:'<path d="M6 6l12 12M18 6L6 18"/>',
 phai:'<path d="M9.5 5.5L16 12l-6.5 6.5"/>',
 len:'<path d="M12 19V6M6 12l6-6 6 6"/>',
 xuong:'<path d="M12 5v13M6 12l6 6 6-6"/>',
 nguon:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.02"/>',
 sao:'<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/>',
 toi:'<path d="M20 14.2A8.4 8.4 0 019.8 4 8.4 8.4 0 1020 14.2z"/>',
 sang:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.3 6.3L4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5"/>',
};
const ic=(k,sz)=>`<svg viewBox="0 0 24 24"${sz?` style="width:${sz}px;height:${sz}px"`:''}
  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
  stroke-linejoin="round">${IC[k]||''}</svg>`;

function spark(a,w,h,c){
  if(!a||a.length<2) return '';
  const mn=Math.min(...a),mx=Math.max(...a),d=(mx-mn)||1;
  const p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-(v-mn)/d*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    <polyline points="${p}" fill="none" stroke="${c}" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---- trạng thái ---- */
const S={m:'bang',t:'',sym:null,sort:'gt',dir:-1,loc:'all',ctLoc:'all',tdOpen:null,cpTab:'nam',
         raceSec:'Ngân hàng'};
const TAB=[['bang','Bảng giá'],['bong','Bong bóng'],['radar','Radar'],
           ['dua','Đường đua'],['tap','Tập đoàn']];
const SUB={
 radar:[['phien','Nhịp phiên','phien'],['cd','Chủ điểm đầu tư','chudiem'],
        ['vb','Khi nào về bờ','vebo']],
 dua:[['dua','Đường đua vốn hoá','duadua'],['dca','Đầu tư bền vững','dca']],
 tap:[['td','Tập đoàn','tap'],['quy','Quỹ đầu tư','quy']],
};
const TEN={bang:'Bảng giá',bong:'Bản đồ bong bóng',radar:'Radar',dua:'Đường đua',tap:'Danh mục tập đoàn'};

/* ========================= ĐẦU TRANG ====================================== */
function drawTop(){
  const idx=!D?'':D.idx.map(x=>`<div class="chipx"><div class="k">${esc(x.n)}</div>
    <div class="v">${nf(x.v,2)}</div>
    <div class="c ${cls(x.chg)}">${pc(x.chg)}</div>
    <div class="g">${nf(x.gt)} tỷ</div></div>`).join('');
  $('#top').innerHTML=`
    <div class="tbar">
      ${S.m==='cp'?`<button class="ico" data-back style="padding:0 8px">${ic('back')}</button>
        <span class="brand">${S.sym||''}</span>`
        :`<span class="brand">CPVN<em>.IO</em></span>`}
      <span class="sp"></span>
      <button class="ico" data-sheet="loc">${ic('loc')}Lọc</button>
      <button class="ico" data-sheet="ct">${ic('lich')}Cổ tức</button>
    </div>
    ${S.m==='bang'&&D?`<div class="scrx"><div class="idxrow">${idx}</div></div>`:''}
    ${SUB[S.m]?`<div class="scrx"><div class="subs">${SUB[S.m].map(([k,t,i])=>
      `<button data-sub="${k}" class="${S.t===k?'on':''}">${ic(i)}${t}</button>`).join('')
      }</div></div>`:''}`;
}
function drawTabs(){
  $('#tabs').innerHTML=TAB.map(([k,t])=>
    `<button data-tab="${k}" class="${S.m===k?'on':''}">${ic(k)}<span>${t}</span></button>`).join('');
}

/* ========================= MÀN 1 · BẢNG GIÁ =============================== */
const LOC=[['all','Tất cả'],['vn30','VN30'],['hose','HOSE'],['hnx','HNX'],['upcom','UPCOM'],
           ['tang','Đang tăng'],['giam','Đang giảm']];
const SORT=[['gt','GTGD'],['mc','Vốn hoá'],['chg','1 ngày'],['c','Giá']];

function locRows(){
  let r=D.board.slice();
  if(S.loc==='hose')r=r.filter(x=>x.ex==='HOSE');
  if(S.loc==='hnx')r=r.filter(x=>x.ex==='HNX');
  if(S.loc==='upcom')r=r.filter(x=>x.ex==='UPCOM');
  if(S.loc==='vn30')r=r.filter(x=>x.mc>60000&&x.ex==='HOSE');
  if(S.loc==='tang')r=r.filter(x=>x.chg>0);
  if(S.loc==='giam')r=r.filter(x=>x.chg<0);
  return r.sort((a,b)=>((b[S.sort]||0)-(a[S.sort]||0))*(S.dir<0?1:-1));
}
function rowHTML(c){
  return `<button class="row" data-sym="${c.s}">
    <span class="co">${logo(c.s)}<span class="id">
      <span class="s">${c.s}</span><span class="n">${esc(c.n)}</span></span></span>
    <span class="px"><span class="p ${cls(c.chg)}">${nf(c.c)}</span>
      <span class="g">${nf(c.gt)} tỷ</span></span>
    <span class="pc ${cls(c.chg)}"><i>${pc(c.chg)}</i></span></button>`;
}
/* Mũi tên xếp thứ tự vẽ bằng icon chứ không dùng ký tự ↓↑ — ký tự lấy theo font
   hệ thống nên nét dày mỏng không ăn nhập với chữ bên cạnh, mỗi máy một khác. */
const th=(k,t)=>`<b data-sort="${k}" class="${S.sort===k?'act':''}">${t}${
  S.sort===k?ic(S.dir<0?'xuong':'len'):''}</b>`;
function mBang(){
  const r=locRows();
  return `<div class="thead"><span>Cổ phiếu · ${r.length} mã</span>
      ${th('c','Giá · GTGD')}${th('chg','1D')}</div>
    ${r.map(rowHTML).join('')}
    <div class="hint">Đang xem ${r.length} mã thanh khoản cao nhất phiên ${D.date}.
      Bản thật liệt kê đủ <b>${nf(D.nSyms)} mã</b> ba sàn.</div>`;
}

/* ========================= MÀN 2 · BONG BÓNG ============================== */
function mBong(){
  const W=352,H=430,pad=4;
  const list=D.bigs.slice(0,44);
  const mx=Math.max(...list.map(x=>x.mc));
  const put=[];
  list.forEach(c=>{
    const r=Math.max(15,Math.sqrt(c.mc/mx)*54);
    /* xoáy ốc từ tâm ra: tìm chỗ trống đầu tiên không đè lên bóng đã đặt */
    let ok=null;
    for(let k=0;k<3000&&!ok;k++){
      const a=k*0.55, rad=3.2*Math.sqrt(k)*1.9;
      const x=W/2+rad*Math.cos(a), y=H/2+rad*Math.sin(a);
      if(x-r<pad||x+r>W-pad||y-r<pad||y+r>H-pad) continue;
      if(put.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+r+2.5)) ok={x,y};
    }
    if(ok) put.push({...ok,r,c});
  });
  const col=v=>v>2?'var(--up)':v>0?'rgba(34,201,138,.72)':v<-2?'var(--dn)':v<0?'rgba(240,80,92,.72)':'var(--ref)';
  const bub=put.map(p=>`<g>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}"
        fill="${col(p.c.chg)}" fill-opacity=".2" stroke="${col(p.c.chg)}" stroke-width="1.4"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-1).toFixed(1)}" text-anchor="middle"
        font-size="${Math.min(13,Math.max(8,p.r/2.5)).toFixed(0)}" font-weight="800"
        fill="var(--txt)">${p.c.s}</text>
      ${p.r>21?`<text x="${p.x.toFixed(1)}" y="${(p.y+11).toFixed(1)}" text-anchor="middle"
        font-size="9.5" font-weight="700" fill="${col(p.c.chg)}">${pc(p.c.chg)}</text>`:''}
    </g>`).join('');
  return `<div class="h2">Bản đồ bong bóng<span>Bóng to = vốn hoá lớn · màu = biến động phiên ${D.date}</span></div>
    <div class="card"><div class="b" style="padding:6px">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${bub}</svg></div></div>
    <div class="chips">${['Vốn hoá','1 ngày','1 tuần','1 năm','Khối ngoại'].map((t,i)=>
      `<button class="${i===1?'on':''}">${t}</button>`).join('')}</div>
    <div class="hint">Trên màn hẹp thì bóng dưới 15px không đọc nổi chữ, nên bản mobile
      chỉ vẽ ${put.length} mã lớn nhất và cho lọc theo ngành thay vì nhồi hết ${nf(D.nSyms)} mã.</div>`;
}

/* ========================= MÀN 3 · RADAR ================================== */
function gauge(v,lab){
  const a=(v/100)*180-180, R=64, cx=84, cy=76;
  const x=cx+R*Math.cos(a*Math.PI/180), y=cy+R*Math.sin(a*Math.PI/180);
  const c=v>=75?'var(--up)':v>=55?'#84cc16':v>=45?'var(--ref)':v>=25?'#fb923c':'var(--dn)';
  return `<svg viewBox="0 0 168 96" width="168" height="96">
    <path d="M20 76a64 64 0 0 1 128 0" fill="none" stroke="var(--pan2)" stroke-width="13" stroke-linecap="round"/>
    <path d="M20 76a64 64 0 0 1 128 0" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${(v/100*201).toFixed(0)} 400"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${c}" stroke="var(--pan)" stroke-width="2.5"/>
    <text x="84" y="70" text-anchor="middle" font-size="27" font-weight="800" fill="var(--txt)">${Math.round(v)}</text>
    <text x="84" y="88" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--mut2)">${lab}</text>
  </svg>`;
}
function movers(list,t){
  return `<div class="card"><div class="h"><span class="t">${t}</span>
      <span class="s">giá · GTGD</span></div>
    <div class="b" style="padding:6px 0 2px">${list.map((c,i)=>`
      <button class="row" data-sym="${c.s}" style="min-height:48px;${
        i===list.length-1?'box-shadow:none':''}">
        <span class="co">${logo(c.s)}<span class="id"><span class="s">${c.s}</span>
          <span class="n">${esc(c.n)}</span></span></span>

/* Ba vòng đặt theo tam giác đều — có vậy bảy vùng mới đủ rộng để nhét chữ.
   Vòng 0 (tăng trưởng) trên, vòng 1 (nâng hạng) trái dưới, vòng 2 (định giá) phải dưới.
   Chỗ đặt chữ tính tay theo hình: giao ba ở trọng tâm, giao đôi đẩy ra xa vòng thứ
   ba, phần riêng đẩy hẳn ra rìa. Chú thích màu tách xuống HTML để không đè lên chữ. */
function vennSVG(){
  const T=D.cd.truc, W=352,H=266, R=82, cx=176;
  const P=[[cx,99],[cx-44,175],[cx+44,175]];
  const NEO={'dg|nh|tt':[cx,154],'nh|tt':[126,121],'dg|tt':[226,121],'dg|nh':[cx,207],
             'tt':[cx,53],'nh':[92,192],'dg':[260,192]};
  const key=m=>m.truc.slice().sort().join('|'), grp={};
  D.cd.ma.forEach(m=>(grp[key(m)]=grp[key(m)]||[]).push(m.s));
  const lab=Object.entries(grp).map(([k,arr])=>{
    const p=NEO[k]||[cx,154], L=[];
    for(let i=0;i<arr.length;i+=2) L.push(arr.slice(i,i+2).join(' '));
    return L.map((l,i)=>`<text x="${p[0]}" y="${p[1]+i*14-(L.length-1)*7}"
      text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--txt)">${l}</text>`).join('');
  }).join('');
  return `<svg class="venn" viewBox="0 0 ${W} ${H}" width="100%">
    ${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${R}" fill="${T[i].mau}" fill-opacity=".17"
      stroke="${T[i].mau}" stroke-width="1.6"/>`).join('')}${lab}</svg>
    <div style="display:flex;flex-wrap:wrap;gap:9px 14px;padding:8px 4px 2px">
      ${T.map(t=>`<span style="display:flex;align-items:center;gap:6px;font-size:var(--f2);
        font-weight:700;color:var(--mut)">
        <i style="width:10px;height:10px;border-radius:50%;background:${t.mau};
          display:inline-block"></i>${esc(t.ten)}</span>`).join('')}</div>`;
}

        <div><div class="nm" style="display:flex;align-items:center;gap:7px">

    <div class="card"><div class="h"><span class="t">Cổ tức đã trả</span></div>
      <div class="fin">${K.div.map(d=>`<div class="finr" style="grid-template-columns:52px 1fr auto">
        <span class="y">${d.y}</span>
        <span style="color:var(--mut2);font-size:var(--f2)">${
          [d.cash?'tiền '+nf(d.cash)+' đ':'',d.cp?'cổ phiếu '+d.cp+'%':'',d.th?'thưởng '+d.th+'%':'']
          .filter(Boolean).join(' · ')||'không chia'}</span>
        <span class="v">${d.cash?nf(d.cash)+' đ':'—'}</span></div>`).join('')}</div></div>
    <div class="hint">Đây là ba mã có sẵn số thật trong bản demo (FPT · TCB · HPG).
      Bấm mã khác sẽ rơi về FPT.</div>`;
}

/* ========================= TẤM TRƯỢT ====================================== */
/* Nguồn có BỐN loại sự kiện chứ không phải ba: ngoài cổ tức tiền/cổ phiếu/thưởng
   còn PHÁT HÀNH THÊM cho cổ đông hiện hữu — loại này không có tỷ lệ `tl` mà có giá
   phát hành `gia`. Bỏ sót nó thì bảng hiện "undefined%" và nhãn "PHATHANH". */
const KTEN={tien:'Tiền mặt',cp:'Cổ phiếu',thuong:'Thưởng',quyen:'Quyền mua',
            phathanh:'Phát hành thêm'};
const ctGia=x=>x.k==='tien'?nf(x.tien)+' đ'
  :x.k==='phathanh'?(x.gia?nf(x.gia)+' đ':'—')
  :(x.tl!=null?x.tl+'%':'—');
function sheetLoc(){
  return {t:'Bộ lọc',b:`
    <div style="padding:var(--s4) var(--s4) var(--s2)" class="lab">Sàn &amp; rổ</div>
    <div class="chips">${LOC.map(([k,t])=>
      `<button data-loc="${k}" class="${S.loc===k?'on':''}">${t}</button>`).join('')}</div>
    <div style="padding:var(--s2) var(--s4)" class="lab">Sắp theo</div>
    <div class="chips">${SORT.map(([k,t])=>
      `<button data-so="${k}" class="${S.sort===k?'on':''}" style="${
        S.sort===k?'display:flex;align-items:center;gap:4px':''}">${t}${
        S.sort===k?ic(S.dir<0?'xuong':'len'):''}</button>`).join('')}</div>
    <div style="padding:var(--s2) var(--s4)" class="lab">Ngành</div>
    <div class="chips">${D.secs.slice(0,12).map(s=>
      `<button>${esc(s.length>18?s.slice(0,17)+'…':s)}</button>`).join('')}</div>
    <div style="padding:var(--s3) var(--s4) var(--s5);display:flex;gap:var(--s2)">
      <button class="ico" style="flex:1;justify-content:center;height:46px" data-reset>Xoá lọc</button>
      <button class="ico on" style="flex:2;justify-content:center;height:46px" data-close>Xem kết quả</button>
    </div>`};
}
function sheetCt(){
  const F=[['all','Tất cả'],['tien','Tiền mặt'],['cp','Cổ phiếu'],['thuong','Thưởng'],
           ['phathanh','Phát hành']];
  const list=D.ct.filter(x=>S.ctLoc==='all'||x.k===S.ctLoc);
  /* "Ngày giao dịch không hưởng quyền" nói MỘT LẦN ở đầu mỗi nhóm ngày, đừng lặp
     xuống từng dòng: 26 dòng thì câu đó xuất hiện 26 lần, chiếm nửa bảng mà không
     thêm được một chữ thông tin nào — mắt học xong ở dòng đầu là thôi đọc. */
  let cur='',out='';
  list.forEach(x=>{
    if(x.d!==cur){cur=x.d;
      const dt=new Date(x.d);
      out+=`<div class="dday">${dt.toLocaleDateString('vi-VN',
        {weekday:'long',day:'2-digit',month:'2-digit'})}<em>ngày GDKHQ</em></div>`;}
    out+=`<div class="ctr">
      <span style="display:flex;gap:10px;align-items:center">${logo(x.s)}
        <span><b style="font-size:var(--f4);font-weight:800">${x.s}</b>
          <div class="d">${esc(x.gc||'')}</div></span></span>
      <span class="r"><div class="v">${ctGia(x)}</div>
        <div class="k">${KTEN[x.k]||x.k}</div></span></div>`;
  });
  return {t:'Lịch chia cổ tức',b:`
    <div class="chips" style="padding-top:var(--s1)">${F.map(([k,t])=>
      `<button data-ct="${k}" class="${S.ctLoc===k?'on':''}">${t}</button>`).join('')}</div>
    ${out||'<div class="hint">Không có sự kiện nào.</div>'}
    <div class="hint" style="margin-bottom:var(--s5)">Bản thật đang theo dõi
      <b>${nf(D.nCt)} sự kiện</b> từ ${D.ct[0]?.d} trở đi.</div>`};
}
function openSheet(k){
  const o=k==='loc'?sheetLoc():sheetCt();
  $('#sheet .sh').innerHTML=`<span class="t">${o.t}</span>
    <button class="x" data-close>${ic('xoa')}</button>`;
  $('#sheet .sb').innerHTML=o.b;
  $('#sheet').classList.add('on'); $('#mask').classList.add('on');
  $('#sheet').dataset.k=k;
}
const closeSheet=()=>{$('#sheet').classList.remove('on');$('#mask').classList.remove('on');};

/* ========================= VẼ ============================================= */
const skeleton=()=>`<div class="thead"><span>Cổ phiếu</span><b>Giá · GTGD (tỷ)</b><b>1D</b></div>
  <div class="sk">${Array.from({length:9},()=>`<div class="skrow">
    <span class="c1"><u></u><span style="flex:1"><i style="width:44px"></i>
      <i style="width:96px;height:9px;margin-top:6px"></i></span></span>
    <span><i style="width:100%;height:12px"></i><i style="width:60%;height:9px;margin:6px 0 0 auto"></i></span>
    <span><i style="width:100%;height:22px;border-radius:6px"></i></span></div>`).join('')}</div>`;

function draw(){
  drawTop(); drawTabs();
  const B=$('#body');
  B.innerHTML = !D       ? skeleton()
    : S.m==='cp'  ? mCp()
    : S.m==='bang' ? mBang()
    : S.m==='bong' ? mBong()
    : S.m==='tap'  ? (S.t==='quy'?mQuy():mTd())
    : S.m==='radar'? (S.t==='cd'?mCd():S.t==='vb'?mVb():mPhien())
    : S.m==='dua'  ? (S.t==='dca'?mDca():mDua())
    : '';
  B.scrollTop=0;
}
document.addEventListener('click',e=>{
  const t=e.target;
  const tab=t.closest('[data-tab]');
  if(tab){const k=tab.dataset.tab;S.m=k;S.t=(SUB[k]||[['','']])[0][0]||'';draw();return;}
  const sub=t.closest('[data-sub]'); if(sub){S.t=sub.dataset.sub;draw();return;}
  const so=t.closest('[data-sort]'); if(so){
    const k=so.dataset.sort; if(S.sort===k)S.dir*=-1; else{S.sort=k;S.dir=-1;} draw(); return;}
  const sy=t.closest('[data-sym]'); if(sy){S.sym=sy.dataset.sym;S.m='cp';draw();return;}
  const td=t.closest('[data-td]'); if(td){S.tdOpen=S.tdOpen===td.dataset.td?null:td.dataset.td;draw();return;}
  const sh=t.closest('[data-sheet]'); if(sh){openSheet(sh.dataset.sheet);return;}
  if(t.closest('[data-back]')){S.m='bang';S.t='';draw();return;}
  if(t.closest('[data-close]')||t.id==='mask'){closeSheet();return;}
  const lo=t.closest('[data-loc]'); if(lo){S.loc=lo.dataset.loc;openSheet('loc');draw();return;}
  const s2=t.closest('[data-so]');  if(s2){
    const k=s2.dataset.so; if(S.sort===k)S.dir*=-1; else{S.sort=k;S.dir=-1;} openSheet('loc');draw();return;}
  const ct=t.closest('[data-ct]');  if(ct){S.ctLoc=ct.dataset.ct;openSheet('ct');return;}
  if(t.closest('[data-reset]')){S.loc='all';S.sort='gt';S.dir=-1;openSheet('loc');draw();return;}
});
function den(k){
  const p=$('#ph');
  p.classList.toggle('dark',k==='dark'); p.classList.toggle('light',k!=='dark');
  $('#lamp').innerHTML=ic(k==='dark'?'toi':'sang',14);
}
$('#lamp').onclick=()=>den($('#ph').classList.contains('dark')?'light':'dark');

/* ---- ĐIỀU KHIỂN TỪ NGOÀI -------------------------------------------------
   Trang so sánh nhúng cả hai mẫu trong hai iframe rồi lái bằng postMessage,
   nhờ vậy bấm một nút là hai máy cùng nhảy tới ĐÚNG một màn — so mới ra chuyện.
   ?embed=1 giấu bộ nút riêng của bản demo đi vì khung ngoài đã có rồi. */
const QS=new URLSearchParams(location.search);
if(QS.get('embed')) document.querySelector('.ab').style.display='none';
if(QS.get('m')) S.m=QS.get('m');
if(QS.get('t')!==null) S.t=QS.get('t');
if(QS.get('sym')) S.sym=QS.get('sym');
if(QS.get('theme')) den(QS.get('theme'));
addEventListener('message',e=>{
  const d=e.data||{}; if(d.cpvn!=='go') return;
  if(d.theme) den(d.theme);
  if(d.sheet){ if(D) openSheet(d.sheet); return; }
  closeSheet();
  if(d.m){ S.m=d.m; S.t=d.t||''; if(d.sym) S.sym=d.sym; if(D) draw(); }
});

den($('#ph').classList.contains('dark')?'dark':'light');
draw();   /* vẽ khung xương trước, số về sau — mắt bám được bố cục ngay */
fetch('assets/demo-mobi.json?v=4').then(r=>r.json()).then(j=>{D=j;draw();})
  .catch(()=>{$('#body').innerHTML='<div class="hint">Không nạp được assets/demo-mobi.json — '
    +'trang này phải mở qua web chứ không mở thẳng từ file.</div>';});
</script>
</body>
</html>
